# Askbar. Copy .env.example to .env and edit it first.
#   docker compose up -d                    server, admin and the HTTPS front end (Caddy)
#   docker compose --profile dev up -d      plus the mock LLM (tests/mock_llm.py)
#   docker compose --profile cpa up -d      plus CLIProxyAPI (subscription logins as a provider)
#
# Three services, two networks:
#   edge  Caddy and the server (the device API on 8080). Caddy is the only service with published ports.
#   mgmt  the admin and the server's management API, nothing else. `internal`, so it has no route out.
# The admin joins no network but mgmt. Caddy reaches it only through its unix socket (volume admin-run),
# for admin.<hostname>.

services:
  server:
    build:
      context: .
      target: server
    image: askbar-server:latest
    container_name: askbar-server
    restart: unless-stopped
    environment:
      # One specific address on the mgmt network; the server refuses a wildcard here.
      ASKBAR_MGMT_ADDR: 172.30.0.2:8082
    networks:
      edge: {}
      mgmt:
        ipv4_address: 172.30.0.2
    volumes:
      # The bind-mounted DATA_DIR must be writable by uid 10002.
      - ${DATA_DIR:-./data}:/data
      # The master key (created on first start) lives here, alone: backups of DATA_DIR never contain it.
      # Back this volume up separately; without master.key the server will not start against a database
      # that holds encrypted provider keys.
      - askbar-secrets:/secrets
      # The admin's token hash (token.sha256). Read-only: the server can check the token, never mint one.
      - askbar-mgmt:/mgmt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    build:
      context: .
      target: admin
    image: askbar-admin:latest
    container_name: askbar-admin
    restart: unless-stopped
    environment:
      ASKBAR_SERVER_MGMT_URL: http://172.30.0.2:8082
      ASKBAR_PUBLIC_URL: ${ASKBAR_PUBLIC_URL:-}
    networks:
      mgmt:
        ipv4_address: 172.30.0.3
    volumes:
      - admin-data:/admin-data
      - admin-secrets:/admin-secrets
      - askbar-mgmt:/mgmt
      - admin-run:/run/admin
      - caddy-run:/caddy-run
      - caddy-secrets:/caddy-secrets

  mock-llm:
    profiles: ["dev"]
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      MOCK_LLM_HOST: "0.0.0.0"
    command: ["python", "/app/mock_llm.py", "8765"]
    networks:
      - edge
    volumes:
      - ./tests/mock_llm.py:/app/mock_llm.py:ro

  # HTTPS front end. Configured by the admin through Caddy's admin socket; nothing secret in this file.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: askbar-caddy:latest
    container_name: askbar-caddy
    restart: unless-stopped
    # Group 10001 is the admin's: Caddy's admin socket (mode 0660) is then owned by root:10001, so the
    # admin can use it and nothing else can.
    user: "0:10001"
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - edge
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-run:/run/caddy
      - admin-run:/run/admin
      - caddy-secrets:/caddy-secrets:ro

  # --- CLIProxyAPI: use a ChatGPT/Claude/Gemini subscription as an OpenAI-compatible provider. ---
  # `docker compose --profile cpa up -d`, then see cpa/README or the main README for the one-time login.
  # Its API port is NOT published; only containers on this compose network (the server) can reach it.
  cpa-init:
    profiles: ["cpa"]
    image: eceasy/cli-proxy-api:latest
    # Strips CRs first, so the script still runs if a Windows checkout turned its line endings into CRLF.
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /init.sh | sh -s -- \"$$@\"", "init"]
    volumes:
      - ./cpa/init.sh:/init.sh:ro
      - cpa-config:/cpa-config

  cpa:
    profiles: ["cpa"]
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    depends_on:
      cpa-init:
        condition: service_completed_successfully
    command: ["./CLIProxyAPI", "-config", "/cpa-config/config.yaml"]
    networks:
      - edge
    volumes:
      - cpa-config:/cpa-config
      - cpa-auth:/root/.cli-proxy-api

  # One-time provider login (run on demand, never started by `up`):
  #   docker compose --profile cpa run --rm --service-ports cpa-login ./CLIProxyAPI -config /cpa-config/config.yaml -claude-login -no-browser
  # `--service-ports` publishes the OAuth callback ports on 127.0.0.1 for the duration of that command only.
  # Other logins: -codex-login (port 1455), -login/-antigravity-login, ... see `./CLIProxyAPI -h`.
  cpa-login:
    profiles: ["cpa-login"]
    image: eceasy/cli-proxy-api:latest
    volumes:
      - cpa-config:/cpa-config
      - cpa-auth:/root/.cli-proxy-api
    ports:
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:51121:51121"

networks:
  edge:
  mgmt:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  askbar-secrets:
  askbar-mgmt:
  admin-data:
  admin-secrets:
  admin-run:
  caddy-run:
  caddy-secrets:
  caddy-data:
  caddy-config:
  cpa-config:
  cpa-auth:
