# Askbar. Copy .env.example to .env and edit it first.
#   docker compose up -d                    server, admin, the HTTPS front end (Caddy) and CLIProxyAPI
#   docker compose --profile dev up -d      plus the mock LLM (tests/e2e/mock_llm.py)
#
# Services and networks. There is no controller and no service has the Docker socket: the admin restarts
# the server and itself through their own endpoints, Caddy by a config reload and CLIProxyAPI by rewriting
# its config (ADR 0005); Docker's restart policy starts a service that exits.
#   edge  Caddy and the server (the client API on 8080). Caddy is the only service with published ports.
#   server-api  the admin and the server's server API, nothing else. `internal`, so it has no route out.
# The admin joins no network but server-api. Caddy reaches it only through its unix socket (volume admin-run),
# for /admin. One host serves the admin (/admin), the client API (/api/client) and a 404 for the rest: over HTTPS
# from the first start, with the install's own certificate until a host name with a real one is set.

# Every service starts from these settings (ADR 0032): a read-only root, no capabilities, no privilege gain,
# caps on processes and memory, and a private /tmp. A service writes only to its own volumes. Exceptions are
# listed on the service that needs them.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp

services:
  server:
    build:
      context: .
      target: server
    image: askbar-server:latest
    container_name: askbar-server
    restart: unless-stopped
    <<: *hardening
    mem_limit: 512m
    environment:
      # One specific address on the server-api network; the server refuses a wildcard here.
      ASKBAR_SERVER_API_ADDR: 172.30.0.2:8082
      # audit.db lives on its own volume, mounted into the server and nothing else.
      ASKBAR_AUDIT_DIR: /audit
    networks:
      edge: {}
      server-api:
        ipv4_address: 172.30.0.2
    volumes:
      # The bind-mounted DATA_DIR must be writable by uid 10002.
      - ${DATA_DIR:-./data}:/data
      # The master key (created on first start) lives here, alone: backups of DATA_DIR never contain it.
      # Back this volume up separately; without master.key the server will not start against a database
      # that holds encrypted provider keys.
      - askbar-secrets:/secrets
      # The audit store (audit.db): a trace of every reply. Only the server mounts it; the admin reads
      # it through the server API, never from disk. Back it up by copying the volume.
      - audit-data:/audit
      # The admin's token hash (token.sha256). Read-only: the server can check the token, never mint one.
      - server-token:/server-token:ro

  admin:
    build:
      context: .
      target: admin
    image: askbar-admin:latest
    container_name: askbar-admin
    restart: unless-stopped
    <<: *hardening
    mem_limit: 256m
    environment:
      ASKBAR_SERVER_API_URL: http://172.30.0.2:8082
      ASKBAR_PUBLIC_URL: ${ASKBAR_PUBLIC_URL:-}
    networks:
      server-api:
        ipv4_address: 172.30.0.3
      # CLIProxyAPI's own API (accounts and logins), on a network of the two of them with no route out.
      cpa-admin: {}
    volumes:
      # CLIProxyAPI's config: the admin makes it (API key and control secret) before CPA starts.
      - cpa-config:/cpa-config
      - admin-data:/admin-data
      - admin-secrets:/admin-secrets
      - server-token:/server-token
      - admin-run:/run/admin
      - caddy-run:/caddy-run
      - caddy-secrets:/caddy-secrets

  mock-llm:
    profiles: ["dev"]
    image: python:3.12-slim
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    environment:
      MOCK_LLM_HOST: "0.0.0.0"
    command: ["python", "/app/mock_llm.py", "8765"]
    networks:
      - edge
    volumes:
      - ./tests/e2e/mock_llm.py:/app/mock_llm.py:ro

  # HTTPS front end. Configured by the admin through Caddy's admin socket; nothing secret in this file.
  caddy:
    build:
      context: .
      target: caddy
    image: askbar-caddy:latest
    container_name: askbar-caddy
    restart: unless-stopped
    <<: *hardening
    # Binding 80 and 443 is the one capability Caddy keeps. It reads the admin's key and token files
    # (mode 0640) through group 10001, so it needs no CAP_DAC_OVERRIDE.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    # Group 10001 is the admin's: Caddy's admin socket (mode 0660) is then owned by root:10001, so the
    # admin can use it and nothing else can.
    user: "0:10001"
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - edge
    # 80 only redirects to 443. Until a host name is set, 443 answers on every address with the install's own
    # certificate (made by the admin in caddy-secrets), and the admin site is open to private addresses only.
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-run:/run/caddy
      - admin-run:/run/admin
      - caddy-secrets:/caddy-secrets:ro

  # --- CLIProxyAPI: use a ChatGPT/Claude subscription as an OpenAI-compatible provider. ---
  # Starts with the stack and idles until an account is connected on the admin site's Services tab. The admin
  # makes its config and API key (it must be healthy first) and runs the logins; there is no terminal step.
  # Its API port is NOT published; only containers on its networks can reach it: the server (edge) and the
  # admin (cpa-admin).
  cpa:
    image: eceasy/cli-proxy-api:v8.0.51@sha256:15d13889e1a39a688be306dfbf2f6cf9003e99cd913b5070fa463f8ab2aa0031
    container_name: askbar-cpa
    restart: unless-stopped
    # No exception needed (tested with v8.0.51): logins go to cpa-auth, and the admin writes the config. CPA
    # logs a warning that it cannot make /cpa-config/static, its own web panel, which Askbar does not use.
    <<: *hardening
    mem_limit: 512m
    depends_on:
      admin:
        condition: service_healthy
    command: ["./CLIProxyAPI", "-config", "/cpa-config/config.yaml"]
    networks:
      - edge
      - cpa-admin
    volumes:
      - cpa-config:/cpa-config
      - cpa-auth:/root/.cli-proxy-api

networks:
  edge:
  server-api:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # The admin and CLIProxyAPI, nothing else. No route out.
  cpa-admin:
    internal: true

volumes:
  askbar-secrets:
  audit-data:
  server-token:
  # Held the retired controller's token hash (ADR 0005). Nothing mounts it now; kept declared until 1.0
  # so no install loses a volume by surprise (plan-v1.md: data volumes are never renamed or dropped pre-1.0).
  control-token:
  admin-data:
  admin-secrets:
  admin-run:
  caddy-run:
  caddy-secrets:
  caddy-data:
  caddy-config:
  cpa-config:
  cpa-auth:
