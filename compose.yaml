# Askbar. Copy .env.example to .env and edit it first.
#   docker compose up -d                    server, admin, the HTTPS front end (Caddy) and CLIProxyAPI
#   docker compose --profile dev up -d      plus the mock LLM (tests/e2e/mock_llm.py)
#
# Services and networks. There is no controller and no service has the Docker socket: the admin restarts
# the server and itself through their own endpoints, Caddy by a config reload and CLIProxyAPI by rewriting
# its config (ADR 0005); Docker's restart policy starts a service that exits.
#   edge  Caddy, CLIProxyAPI and the mock LLM in dev. Caddy is the only service with published ports. The server is not
#         on it: it has no route out.
#   client-api  Caddy and the server's client API on 8080, nothing else. `internal`.
#   server-api  the admin and the server's server API, nothing else. `internal`, so it has no route out.
#   audit-caddy  Caddy and the auditor, nothing else. `internal`. Caddy's access lines go to the auditor's ingest listener on it
#               (ADR 0051); the auditor's token API is not bound there.
#   audit-admin  the admin and the auditor, nothing else. `internal`, so it has no route out. Each caller of the
#               auditor gets a network like it, shared with the auditor alone (ADR 0051).
#   gateway-admin  the admin and model-gateway, nothing else. `internal`. gateway-server (the server and the gateway) and
#               audit-server (the server and the auditor) are the same; audit-model-gateway is the gateway's and the auditor's.
#   outbound  model-gateway, and in the dev profile the mock LLM. The one network besides `edge` with a route out
#               (ADR 0006, ADR 0054); nothing else joins it.
#   cpa-gateway  model-gateway and CLIProxyAPI, nothing else. `internal`.
#   audit-alerter  the auditor and the alerter, nothing else. `internal`. The auditor sends its alert events on it, and the
#               alerter appends the outcome of each alert (ADR 0055); alerter-admin (the admin and the alerter) is the same.
#   alerter-outbound  the alerter alone. Not `internal`: its route out is for delivering alerts (ntfy, later email) and
#               checking for releases. It is not `outbound`, where model-gateway sits, so nothing else is on it (ADR 0055).
# No network pins a subnet or an address; Docker assigns them (docs/guide.md, "Docker networks").
# The admin joins no network but server-api. Caddy reaches it only through its unix socket (volume admin-run),
# for /admin. One host serves the admin (/admin), the client API (/api/client) and a 404 for the rest: over HTTPS
# from the first start, with the install's own certificate until a host name with a real one is set.

# Every service starts from these settings (ADR 0032): a read-only root, no capabilities, no privilege gain,
# caps on processes and memory, and a private /tmp. A service writes only to its own volumes. Exceptions are
# listed on the service that needs them.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp

services:
  # Creates the per-link tokens and exits (ADR 0049). Root with CHOWN and nothing else (ADR 0032 rule 6): it
  # takes a credential volume over, writes the files, and gives each to the service that reads it. No
  # network. Rotate from the host: docker compose run --rm bootstrap rotate [link].
  # The server and the admin start only after it has finished.
  bootstrap:
    build:
      context: .
      target: bootstrap
    image: askbar-bootstrap:latest
    container_name: askbar-bootstrap
    restart: "no"
    <<: *hardening
    user: "0"
    cap_add: [CHOWN]
    network_mode: none
    mem_limit: 64m
    volumes:
      - server-token:/server-token
      - admin-token:/admin-token
      - auditor-token:/auditor-token
      - model-gateway-token:/model-gateway-token
      - alerter-token:/alerter-token

  server:
    build:
      context: .
      target: server
    image: askbar-server:latest
    container_name: askbar-server
    restart: unless-stopped
    <<: *hardening
    mem_limit: 512m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      # The server's own address on server-api: the alias below exists on that network only, so the
      # server API listens there and nowhere else. The server refuses a wildcard, or a name that resolves
      # to more than one address.
      ASKBAR_SERVER_API_ADDR: server-api-host:8082
    networks:
      # Caddy reaches the client API here, on a network of the two of them: `edge` has a route out, and the server has
      # none (ADR 0006, ADR 0054).
      client-api: {}
      server-api:
        aliases: [server-api-host]
      # The gateway (replies) and the auditor (records) each get a network of their own with the server (ADR 0054, 0051).
      gateway-server: {}
      audit-server: {}
    volumes:
      # The bind-mounted DATA_DIR must be writable by uid 10002.
      - ${DATA_DIR:-./data}:/data
      # The hash of the admin's token (accept/admin-server.sha256) and the server's own tokens for the gateway and the
      # auditor (call/), made by bootstrap. Read-only: the server can check and use a token, never mint one. It holds no
      # provider key and no audit store (ADR 0054, ADR 0051): `askbar-secrets` and `audit-data` stay declared, unmounted.
      - server-token:/server-token:ro

  admin:
    build:
      context: .
      target: admin
    image: askbar-admin:latest
    container_name: askbar-admin
    restart: unless-stopped
    <<: *hardening
    mem_limit: 256m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASKBAR_SERVER_API_URL: http://server-api-host:8082
      # model-gateway's listener for the admin, on gateway-admin (ADR 0054): the admin gives it the provider keys.
      ASKBAR_GATEWAY_URL: http://gateway-admin-host:8084
      ASKBAR_ALERTER_URL: http://alerter-admin-host:8085
      # The auditor, on audit-admin (ADR 0051): the Audit pages read it with the admin's read token.
      ASKBAR_AUDIT_API_URL: http://auditor:8083
      ASKBAR_PUBLIC_URL: ${ASKBAR_PUBLIC_URL:-}
    networks:
      server-api: {}
      # CLIProxyAPI's own API (accounts and logins), on a network of the two of them with no route out.
      cpa-admin: {}
      # The auditor's API (append and read), on a network of the two of them with no route out.
      audit-admin: {}
      # The gateway's API (status, configuration, restart), on a network of the two of them with no route out.
      gateway-admin: {}
      # The alerter's API (delivery settings, test, status, restart, its own events), the same way (ADR 0055).
      alerter-admin: {}
    volumes:
      # CLIProxyAPI's config: the admin makes it (API key and control secret) before CPA starts.
      - cpa-config:/cpa-config
      - admin-data:/admin-data
      - admin-secrets:/admin-secrets
      # The token this admin sends to the server (call/admin-server.token), made by bootstrap. Read-only.
      - admin-token:/admin-token:ro
      - admin-run:/run/admin
      - caddy-run:/caddy-run
      - caddy-secrets:/caddy-secrets

  # The audit store as its own container (ADR 0051): /api/audit/v1 on 8083, reachable only on the audit-* networks,
  # one for each caller, and with no route out. No exception to the hardening above. Runs as uid 10003 from the
  # image; /audit belongs to that uid there, so Docker makes a new auditor-data volume the same. The gateway and the server
  # append to it on audit-model-gateway and audit-server; the admin reaches it on audit-admin.
  auditor:
    build:
      context: .
      target: auditor
    image: askbar-auditor:latest
    container_name: askbar-auditor
    restart: unless-stopped
    <<: *hardening
    mem_limit: 256m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      # The token API on the address its alias has on each of the three networks of its callers, never a wildcard, so
      # nothing on audit-caddy reaches it; the ingest listener for Caddy's access lines on audit-caddy alone (ADR 0051).
      ASKBAR_AUDIT_API_ADDRS: auditor-admin-host:8083,auditor-model-gateway-host:8083,auditor-server-host:8083,auditor-alerter-host:8083
      ASKBAR_AUDIT_INGEST_ADDR: auditor-ingest-host:8086
    networks:
      audit-admin:
        aliases: [auditor-admin-host]
      audit-model-gateway:
        aliases: [auditor-model-gateway-host]
      audit-server:
        aliases: [auditor-server-host]
      # The alerter appends the outcome of each alert here, and the auditor sends its events to the alerter on it (ADR 0055).
      audit-alerter:
        aliases: [auditor-alerter-host]
      # Caddy's access lines. The ingest listener only; the token API is not on this network.
      audit-caddy:
        aliases: [auditor-ingest-host]
    volumes:
      # audit.db: the audit store. Only the auditor mounts it. Starts empty; the server's own audit-data is not
      # copied (see the guide).
      - auditor-data:/audit
      # The hashes of the tokens it accepts, made by bootstrap. Read-only.
      - auditor-token:/auditor-token:ro

  # Provider calls and provider keys (ADR 0054): /api/model-gateway/v1 on two listeners, one on gateway-server for the
  # server and one on gateway-admin for the admin, each on the address its alias gives and never a wildcard. The
  # keys are pushed by the admin and held in memory only, so there is no data volume: its one volume is its credential
  # volume, read-only. It reaches the auditor on audit-model-gateway and the providers on `outbound`. No exception to
  # the hardening above. The server calls it for every reply (plan step 3.1).
  model-gateway:
    build:
      context: .
      target: model-gateway
    image: askbar-model-gateway:latest
    container_name: askbar-model-gateway
    restart: unless-stopped
    <<: *hardening
    mem_limit: 256m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASKBAR_GATEWAY_SERVER_ADDR: gateway-server-host:8084
      ASKBAR_GATEWAY_ADMIN_ADDR: gateway-admin-host:8084
      ASKBAR_AUDIT_API_URL: http://auditor:8083
    networks:
      gateway-server:
        aliases: [gateway-server-host]
      gateway-admin:
        aliases: [gateway-admin-host]
      audit-model-gateway: {}
      # CLIProxyAPI's, for a subscription provider; a network of the two of them with no route out.
      cpa-gateway: {}
      outbound: {}
    volumes:
      # The hashes of the tokens it accepts and the token it sends the auditor, made by bootstrap. Read-only.
      - model-gateway-token:/model-gateway-token:ro

  # Alert delivery (ADR 0055): /api/alerter/v1 on two listeners, one on audit-alerter for the auditor and one on alerter-admin
  # for the admin, each on the address its alias gives and never a wildcard, because it also sits on alerter-outbound. Runs as
  # uid 10005 from the image, with no exception to the hardening above, and 128 MB. Two volumes: alerter-data (the repeat
  # ledger: keys, times and counts, no secret and no content) and its credential volume, read-only. The delivery settings are
  # the admin's, pushed in memory (nothing secret is on a volume). alerter-outbound is the only network with a route out
  # that it joins, and the only one with nothing else on it.
  alerter:
    build:
      context: .
      target: alerter
    image: askbar-alerter:latest
    container_name: askbar-alerter
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASKBAR_ALERTER_AUDITOR_ADDR: alerter-auditor-host:8085
      ASKBAR_ALERTER_ADMIN_ADDR: alerter-admin-host:8085
      ASKBAR_AUDIT_API_URL: http://auditor:8083
    networks:
      audit-alerter:
        aliases: [alerter-auditor-host]
      alerter-admin:
        aliases: [alerter-admin-host]
      alerter-outbound: {}
    volumes:
      - alerter-data:/alerter-data
      # The hashes of the tokens it accepts and the token it sends the auditor, made by bootstrap. Read-only.
      - alerter-token:/alerter-token:ro

  mock-llm:
    profiles: ["dev"]
    image: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    environment:
      MOCK_LLM_HOST: "0.0.0.0"
    command: ["python", "/app/mock_llm.py", "8765"]
    networks:
      - edge
      # The gateway reaches it here: it is the "provider" in the dev profile.
      - outbound
    volumes:
      - ./tests/e2e/mock_llm.py:/app/mock_llm.py:ro

  # HTTPS front end. Configured by the admin through Caddy's admin socket; nothing secret in this file.
  caddy:
    build:
      context: .
      target: caddy
    image: askbar-caddy:latest
    container_name: askbar-caddy
    restart: unless-stopped
    <<: *hardening
    # Binding 80 and 443 is the one capability Caddy keeps. It reads the admin's key and token files
    # (mode 0640) through group 10001, so it needs no CAP_DAC_OVERRIDE.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    # Group 10001 is the admin's: Caddy's admin socket (mode 0660) is then owned by root:10001, so the
    # admin can use it and nothing else can.
    user: "0:10001"
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_healthy
      auditor:
        condition: service_healthy
    networks:
      - edge
      # The client API, on a network of Caddy and the server.
      - client-api
      # Its access lines, to the auditor's ingest listener (ADR 0051). Nothing else is on it but the auditor.
      - audit-caddy
    # 80 only redirects to 443. Until a host name is set, 443 answers on every address with the install's own
    # certificate (made by the admin in caddy-secrets), and the admin site is open to private addresses only.
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-run:/run/caddy
      - admin-run:/run/admin
      - caddy-secrets:/caddy-secrets:ro

  # --- CLIProxyAPI: use a ChatGPT/Claude subscription as an OpenAI-compatible provider. ---
  # Starts with the stack and idles until an account is connected on the admin site's Services tab. The admin
  # makes its config and API key (it must be healthy first) and runs the logins; there is no terminal step.
  # Its API port is NOT published; only containers on its internal networks can reach it: the gateway (cpa-gateway) and
  # the admin (cpa-admin). It reaches the providers on `outbound`.
  cpa:
    # CLIProxyAPI (pinned by digest in the Dockerfile's `cpa` target) under a small supervisor of ours, which
    # restarts it when its config changes or the admin asks: it reads its config only at start (ADR 0037).
    build:
      context: .
      target: cpa
    image: askbar-cpa:latest
    container_name: askbar-cpa
    # Root, as CLIProxyAPI writes /root/.cli-proxy-api, in the admin's group (10001) like Caddy: with every
    # capability dropped, the supervisor writes the admin's restart-done (mode 0660) through the group bit.
    # cpa mounts nothing else group 10001 could open.
    user: "0:10001"
    restart: unless-stopped
    # No exception needed (tested with v8.0.51): logins go to cpa-auth, and the admin writes the config. CPA
    # logs a warning that it cannot make /cpa-config/static, its own web panel, which Askbar does not use.
    <<: *hardening
    mem_limit: 512m
    depends_on:
      admin:
        condition: service_healthy
    networks:
      - cpa-admin
      # The gateway reaches it here, on a network of the two of them (ADR 0054, plan step 3.5).
      - cpa-gateway
      # Its route out, to the subscription providers. It is not on `edge`, so it shares no network with Caddy.
      - outbound
    volumes:
      - cpa-config:/cpa-config
      - cpa-auth:/root/.cli-proxy-api

networks:
  edge:
  server-api:
    internal: true
  # The admin and CLIProxyAPI, nothing else. No route out.
  cpa-admin:
    internal: true
  # The admin and the auditor, nothing else. No route out. No subnet is pinned.
  audit-admin:
    internal: true
  # The auditor and model-gateway, nothing else. No route out.
  audit-model-gateway:
    internal: true
  # model-gateway's listener for the admin. The admin and the gateway, nothing else. No route out.
  gateway-admin:
    internal: true
  # The auditor and the server, nothing else. No route out.
  audit-server:
    internal: true
  # The auditor and Caddy, nothing else. No route out. Caddy's access lines go to the auditor's ingest listener on it.
  audit-caddy:
    internal: true
  # model-gateway's listener for the server. The server and the gateway, nothing else. No route out.
  gateway-server:
    internal: true
  # Caddy and the server's client API, nothing else. No route out: the server has none.
  client-api:
    internal: true
  # model-gateway and CLIProxyAPI, nothing else. No route out.
  cpa-gateway:
    internal: true
  # The auditor and the alerter, nothing else. No route out.
  audit-alerter:
    internal: true
  # The alerter's listener for the admin. The admin and the alerter, nothing else. No route out.
  alerter-admin:
    internal: true
  # The alerter's route out, for delivering alerts and checking for releases (ADR 0055, ADR 0006). Not internal. The alerter
  # alone joins it, so nothing shares a network with it that has a route out, and its listeners are bound to the addresses
  # of its two internal networks, so it answers nothing here.
  alerter-outbound:
  # The providers. Not internal: the one network, besides `edge`, with a route out. Only model-gateway and CLIProxyAPI
  # (and in the dev profile the mock LLM) join it. Their listeners are bound to the addresses of their own internal
  # networks, so neither answers on this one.
  outbound:

volumes:
  # Held the server's master key and provider keys (ADR 0014, 0054). Nothing mounts it now; kept declared until 1.0 so no
  # install loses a volume by surprise (plan-v1.md: data volumes are never renamed or dropped pre-1.0).
  askbar-secrets:
  # Held the server's own audit.db before the auditor. Nothing mounts it now; earlier records stay in it (see the guide).
  audit-data:
  # The auditor's audit.db (ADR 0051). Docker makes it empty and owned by uid 10003, as the image's /audit is.
  auditor-data:
  server-token:
  admin-token:
  # The auditor's credential volume (ADR 0049, 0051): the hashes of the tokens it accepts. Only bootstrap writes it.
  auditor-token:
  # The gateway's credential volume (ADR 0049, 0054): the hashes of the tokens it accepts, and the token it sends the
  # auditor. Only bootstrap writes it.
  model-gateway-token:
  # The alerter's repeat ledger (ADR 0055): keys, times and counts. No secret, no content. Docker makes it empty and owned by
  # uid 10005, as the image's /alerter-data is.
  alerter-data:
  # The alerter's credential volume (ADR 0049, 0055): the hashes of the tokens it accepts, and the token it sends the auditor.
  # Only bootstrap writes it.
  alerter-token:
  # Held the retired controller's token hash (ADR 0005). Nothing mounts it now; kept declared until 1.0
  # so no install loses a volume by surprise (plan-v1.md: data volumes are never renamed or dropped pre-1.0).
  control-token:
  admin-data:
  admin-secrets:
  admin-run:
  caddy-run:
  caddy-secrets:
  caddy-data:
  caddy-config:
  cpa-config:
  cpa-auth:
