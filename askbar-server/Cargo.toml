[package]
name = "askbar-server"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2021"
description = "Askbar server: history, providers and settings behind an HTTP API"

[dependencies]
askbar-core = { path = "../core" }
askbar-proto = { path = "../askbar-proto" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
