[package]
name = "askbar-server"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2021"
description = "Askbar server: history, providers and settings behind an HTTP API"

[dependencies]
askbar-core = { path = "../core" }
askbar-proto = { path = "../askbar-proto" }
axum = "0.8"
futures-util = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
