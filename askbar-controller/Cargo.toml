[package]
name = "askbar-controller"
license = "AGPL-3.0-or-later"
version = "0.5.0"
edition = "2021"
description = "Askbar controller: starts, stops and restarts the Askbar services for the admin, and nothing else"

[dependencies]
askbar-proto = { path = "../askbar-proto", features = ["axum"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_yaml_ng = "0.10"
