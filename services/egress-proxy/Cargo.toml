[package]
name = "askbar-egress-proxy"
license = "AGPL-3.0-or-later"
publish = false
version = "1.0.0"
edition = "2021"
description = "Outbound traffic in its own container, default deny, per-source allowlists (ADR 0056)"

[dependencies]
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
sha2 = "0.10"
ulid = "1"
# YAML in safe Rust, to read our own OpenAPI file (as the alerter does).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }

[lints]
workspace = true
