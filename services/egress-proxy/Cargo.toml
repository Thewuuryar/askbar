[package]
name = "askbar-egress-proxy"
license = "AGPL-3.0-or-later"
publish = false
version = "1.0.0"
edition = "2021"
description = "Outbound traffic in its own container, default deny, per-source allowlists (ADR 0056)"

[dependencies]
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lints]
workspace = true
