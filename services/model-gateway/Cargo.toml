[package]
name = "askbar-model-gateway"
license = "AGPL-3.0-or-later"
publish = false
version = "1.0.0"
edition = "2021"
description = "Provider calls and provider keys in their own container: /api/model-gateway/v1 (ADR 0054)"

[dependencies]
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
axum = "0.8"
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1"

[dev-dependencies]
# The tests run a real auditor in the process, and read what it stored.
askbar-audit = { path = "../../crates/askbar-audit" }
askbar-auditor = { path = "../auditor" }
# YAML in safe Rust, to read our own OpenAPI files (as the server and the auditor do).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }

[lints]
workspace = true
