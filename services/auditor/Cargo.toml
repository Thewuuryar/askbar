[package]
name = "askbar-auditor"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "The audit store as its own container: /api/audit/v1 (ADR 0051)"

[dependencies]
askbar-audit = { path = "../../crates/askbar-audit" }
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# YAML in safe Rust, to read our own OpenAPI files (as the server and the admin do).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
ulid = "1"

[lints]
workspace = true
