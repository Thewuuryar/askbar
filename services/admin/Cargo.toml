[package]
name = "askbar-admin"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "Askbar admin service: the admin site and its own database, kept apart from the server"

[dependencies]
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
argon2 = "0.5"
crypto_box = { version = "0.9", features = ["seal"] }
axum = "0.8"
chacha20poly1305 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Admin pages: compile-time checked templates, escaping by default, nothing read at run time (plan step 1.16).
askama = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[dev-dependencies]
# YAML in safe Rust, to read our own OpenAPI files (it replaced serde_yaml_ng, built on the unmaintained unsafe-libyaml).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
futures-util = "0.3"
askbar-server = { path = "../server" }
askbar-bootstrap = { path = "../bootstrap" }

[lints]
workspace = true
