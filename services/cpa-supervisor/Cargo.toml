[package]
name = "askbar-cpa-supervisor"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "Runs CLIProxyAPI and restarts it on a config change, a restart request or a crash (ADR 0037)"

[dependencies]
# Signals: pass SIGTERM/SIGINT on to CLIProxyAPI and stop it cleanly (std has no signal API).
libc = "0.2"
# Export (ADR 0013): the archive of login files is encrypted to the backup public key with the same age code every service uses.
askbar-service = { path = "../../crates/askbar-service", features = ["backup"] }
serde_json = "1"

[lints]
workspace = true
