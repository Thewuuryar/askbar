[package]
name = "askbar-server"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "Askbar server: history, providers and settings behind an HTTP API"

[dependencies]
askbar-proto = { path = "../../crates/askbar-proto", features = ["axum"] }
askbar-service = { path = "../../crates/askbar-service" }
askbar-audit = { path = "../../crates/askbar-audit", optional = true }
askbar-model-gateway = { path = "../model-gateway", optional = true }
askbar-auditor = { path = "../auditor", optional = true }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-stream = "0.1"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
# Tests only: an in-process gateway and auditor (`testing::rig`), so a test of the server makes a reply the way the stack
# does. Off in every image: the server carries no provider code (ADR 0054).
test-rig = ["dep:askbar-model-gateway", "dep:askbar-auditor", "dep:askbar-audit"]

[dev-dependencies]
askbar-server = { path = ".", features = ["test-rig"] }
# YAML in safe Rust, to read our own OpenAPI files (it replaced serde_yaml_ng, built on the unmaintained unsafe-libyaml).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"

[lints]
workspace = true
