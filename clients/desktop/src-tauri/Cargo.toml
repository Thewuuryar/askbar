[package]
name = "askbar-client"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "A Spotlight-style, conversation-only AI popup"

# The package is askbar-client; the program, installers and product stay "askbar".
[[bin]]
name = "askbar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
# client.yaml: YAML in safe Rust (it replaced serde_yaml_ng, built on the unmaintained unsafe-libyaml).
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
dirs = "6"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
askbar-proto = { path = "../../../crates/askbar-proto" }
opener = { version = "0.8", features = ["reveal"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"

[dev-dependencies]
askbar-server = { path = "../../../services/server" }
axum = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
