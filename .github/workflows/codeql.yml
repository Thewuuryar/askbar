# CodeQL code scanning, in place of GitHub's "default setup" (docs: CONTRIBUTING.md, "H. CodeQL"). The same four languages and the
# same query suite, with the same result category for each (`/language:<language>`), so existing alerts carry over. The one
# difference: Rust takes about seven minutes, about as long as everything else in a pull request together, and is not needed to merge,
# so a pull request analyses JavaScript, Python and the workflows only; a push to `main` and the weekly run analyse Rust too.
# Actions are pinned to commit hashes (ADR 0017).
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["javascript-typescript","python","actions"]' || '["javascript-typescript","python","actions","rust"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
