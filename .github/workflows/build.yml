# Builds and tests Askbar on all three desktop platforms, and builds the server and admin images.
# Run by hand (workflow_dispatch): ci.yml runs the Linux checks on every pull request. Actions are pinned
# to commit hashes (ADR 0017).
name: build

on:
  workflow_dispatch:

# Both jobs only check out code, build, test and upload build output: read access is enough.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: "1.97.0" # as in ci.yml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            clients/desktop

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Rust tests (services and crates)
        run: cargo test --workspace

      - name: Rust tests (desktop client)
        working-directory: clients/desktop
        run: cargo test --workspace

      - name: Markdown renderer tests
        working-directory: clients/desktop
        run: node tests/markdown.test.js

      - name: Install JS dependencies
        working-directory: clients/desktop
        run: npm install

      - name: Build the app
        working-directory: clients/desktop
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: askbar-${{ matrix.os }}
          path: |
            clients/desktop/target/release/bundle/**/*

  images:
    # The server and admin container images build, start and answer their own health checks.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build both images
        run: |
          docker build --target server -t askbar-server:ci .
          docker build --target admin -t askbar-admin:ci .

      - name: Each image answers its health check
        run: |
          docker run -d --name server -e ASKBAR_SERVER_API_ADDR=127.0.0.1:8082 askbar-server:ci
          docker run -d --name admin askbar-admin:ci
          for c in server admin; do
            ok=no
            for i in $(seq 20); do
              if docker exec "$c" "askbar-$c" healthcheck; then ok=yes; break; fi
              sleep 1
            done
            echo "$c healthy: $ok"
            [ "$ok" = yes ] || { docker logs "$c"; exit 1; }
          done
