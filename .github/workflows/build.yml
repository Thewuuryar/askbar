# Builds and tests the desktop client on all three desktop platforms. Run by hand (workflow_dispatch): ci.yml
# runs the Linux checks on every pull request, and it alone tests, builds and scans the services (they run
# in Docker, on Linux only). Actions are pinned to commit hashes (ADR 0017).
name: build

on:
  workflow_dispatch:

# The job only checks out code, builds, tests and uploads build output: read access is enough.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: "1.97.0" # as in ci.yml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            clients/desktop

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # as in ci.yml

      # The services are Linux-only (unix sockets, signals): ci.yml tests them on every pull request.
      - name: Rust tests (services and crates)
        if: runner.os == 'Linux'
        run: cargo test --workspace

      - name: Rust tests (desktop client)
        working-directory: clients/desktop
        run: cargo test --workspace

      - name: Markdown renderer tests
        working-directory: clients/desktop
        run: node tests/markdown.test.js

      - name: Install JS dependencies
        working-directory: clients/desktop
        run: npm ci

      - name: Build the app
        working-directory: clients/desktop
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: askbar-${{ matrix.os }}
          path: |
            clients/desktop/target/release/bundle/**/*
