# Builds and tests Askbar on all three desktop platforms, and builds the server and admin images.
# Not yet run: this repo was developed and verified on Linux only.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust tests
        run: cargo test --workspace

      - name: Markdown renderer tests
        run: node tests/markdown.test.js

      - name: Install JS dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: askbar-${{ matrix.os }}
          path: |
            target/release/bundle/**/*

  images:
    # The server and admin container images build, start and answer their own health checks.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: |
          docker build --target server -t askbar-server:ci .
          docker build --target admin -t askbar-admin:ci .

      - name: Each image answers its health check
        run: |
          docker run -d --name server -e ASKBAR_MGMT_ADDR=127.0.0.1:8082 askbar-server:ci
          docker run -d --name admin askbar-admin:ci
          for c in server admin; do
            ok=no
            for i in $(seq 20); do
              if docker exec "$c" "askbar-$c" healthcheck; then ok=yes; break; fi
              sleep 1
            done
            echo "$c healthy: $ok"
            [ "$ok" = yes ] || { docker logs "$c"; exit 1; }
          done
