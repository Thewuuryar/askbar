# The checks every pull request must pass (contributor guidelines rollout step 4): formatting, clippy,
# the tests, the smoke test, the isolation checks against a real stack, licenses and advisories (and a
# known-vulnerable fixture that `cargo deny` must fail on), a Trivy scan of the images, a check of the
# pinned CLIProxyAPI image, and a secret scan. Linux only; build.yml covers macOS and Windows, by hand.
#
# Actions are pinned to commit hashes and gitleaks to a checksum (ADR 0017); Renovate proposes updates.
# Rust is pinned too, so that a new release's lints never turn every pull request red at once: raise
# RUST_VERSION in its own pull request and fix what it finds.
#
# Speed: the desktop client's system libraries, Playwright's Chromium and the image layers are cached,
# so a run downloads little when nothing changed and a slow Ubuntu mirror cannot stall it for long.
# `npm test` runs as two parallel jobs, test-services and test-desktop (package.json test:services
# and test:desktop); only the desktop half needs the WebKit libraries.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Advisories appear without any change here: check them weekly (ADR 0017, scheduled CVE scans).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Every job only checks out code, builds and tests: read access is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always
  # Line numbers in backtraces, without full debug info: smaller caches and faster builds.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The desktop client's system libraries (README, "Build and run").
  TAURI_LIBS: build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
  # A stalled mirror download gives up after 10 s and is retried, instead of waiting 30 s or more.
  # The archive directory is added in each step, from $HOME, so it always matches the cached path.
  APT_OPTS: -o Acquire::http::Timeout=10 -o Acquire::Retries=3

jobs:
  # Which heavy jobs a pull request needs, from the files it changes. A job skipped by `if` counts as passing for the `main`
  # ruleset's required checks, so this fails open: if it cannot tell, or itself fails, every job runs.
  #   stack    the images and the isolation check: anything but documentation and the desktop client (which no image contains);
  #   desktop  the desktop client's tests: anything but documentation (it depends on crates/ and services/server);
  #   services the cargo tests, the admin browser test and the smoke test: anything but Markdown outside docs/openapi/ and
  #   docs/wire-contract.md (the OpenAPI tests read those).
  # `lint` (which holds the docs and UI-token checks), `dependencies` and `secrets` always run. A push, a manual run and the weekly run run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.diff.outputs.stack }}
      desktop: ${{ steps.diff.outputs.desktop }}
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          all() { printf '%s\n' stack=true desktop=true services=true >> "$GITHUB_OUTPUT"; echo "$1: everything runs"; exit 0; }
          [ "$EVENT_NAME" = pull_request ] || all "not a pull request"
          # The pull request's merge commit: its first parent is the base, so this is exactly what the pull request changes.
          files=$(git diff --name-only HEAD^1 HEAD) || all "could not list the changed files"
          [ -n "$files" ] || all "no changed files"
          echo "$files"
          docs='^(docs/|[^/]+\.md$|LICENSE$|\.github/pull_request_template\.md$)'
          # Markdown that no test reads. The OpenAPI files and the wire contract are the contract the service tests check, so a change
          # to them (or to any file that is not Markdown) runs test-services; the docs check itself runs in lint on every pull request.
          prose='^(docs/[^ ]*\.md|[^/]+\.md|LICENSE|\.github/pull_request_template\.md)$'
          contract='^docs/(openapi/|wire-contract\.md$)'
          stack=false; desktop=false; services=false
          while IFS= read -r f; do
            if [[ "$f" =~ $docs ]]; then
              # Documentation never needs the images or the desktop client; it needs the service tests only if they read it.
              if [[ "$f" =~ $contract ]] || ! [[ "$f" =~ $prose ]]; then services=true; fi
              continue
            fi
            services=true; desktop=true
            [[ "$f" =~ ^clients/desktop/ ]] || stack=true
          done <<< "$files"
          printf '%s\n' "stack=$stack" "desktop=$desktop" "services=$services" >> "$GITHUB_OUTPUT"
          echo "stack=$stack desktop=$desktop services=$services"

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Quick and needing nothing installed, so they come first and fail fast. They also run in `npm run test:services`, for people who run
      # it by hand; test-services is skipped for a Markdown-only pull request, so this is where they run for every pull request.
      - name: Docs and UI token checks
        run: |
          scripts/check-docs.sh
          scripts/check-ui-tokens.sh
      # The downloaded packages, per runner image and version of this file; an older set is a fallback
      # (autoclean drops the packages it no longer needs).
      - name: Runner image
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-
      - name: System libraries
        run: |
          mkdir -p ~/apt-archives/partial
          opts="$APT_OPTS -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $opts update
          sudo apt-get $opts install -y --no-install-recommends $TAURI_LIBS
          sudo apt-get $opts autoclean
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            clients/desktop
      - name: rustfmt
        run: |
          cargo fmt --all --check
          (cd clients/desktop && cargo fmt --all --check)
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          (cd clients/desktop && cargo clippy --workspace --all-targets --locked -- -D warnings)

  # The services, crates, admin browser test, mock LLM and smoke test (and the docs checks again, as part of `npm run test:services`).
  # Skipped for a pull request that changes only Markdown outside the contract files. No system libraries.
  test-services:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.services != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'clients/desktop/package-lock.json') }}
      - name: JS dependencies and the browser for the admin test
        run: |
          npm ci
          npx playwright install chromium
      # The real `age` tool: the backup tests open a whole bundle with it (tests/e2e/age_interop.py), and skip when it is missing.
      - name: age
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends age
      - name: npm run test:services (docs checks, cargo tests, admin browser test, mock LLM)
        run: npm run test:services
      - name: Smoke test
        run: scripts/smoke.sh

  # The desktop client: its cargo tests, the Markdown renderer and the popup browser test.
  test-desktop:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.desktop != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The downloaded packages, per runner image and version of this file; an older set is a fallback
      # (autoclean drops the packages it no longer needs).
      - name: Runner image
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-
      - name: System libraries
        run: |
          mkdir -p ~/apt-archives/partial
          opts="$APT_OPTS -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $opts update
          sudo apt-get $opts install -y --no-install-recommends $TAURI_LIBS
          sudo apt-get $opts autoclean
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clients/desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'clients/desktop/package-lock.json') }}
      - name: JS dependencies and the browser for the popup test
        # The desktop client's own playwright installs the browser its popup test uses.
        run: |
          npm --prefix clients/desktop ci
          npm --prefix clients/desktop exec -- playwright install chromium
      - name: npm run test:desktop (cargo tests, Markdown renderer, popup browser test)
        run: npm run test:desktop

  isolation:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.stack != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds the images compose.yaml names, from this checkout, reusing unchanged layers from
      # GitHub's cache (Caddy's plugin build, the Rust dependency layer and the rest of the build stage).
      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          load: true
          # One cache scope per exporter: targets writing to a shared scope overwrite each other's
          # index. server exports the Rust build stage, which admin and cpa reuse; Caddy has its own.
          set: |
            *.cache-from=type=gha,scope=askbar-build
            server.cache-to=type=gha,mode=max,scope=askbar-build
            caddy.cache-from=type=gha,scope=askbar-caddy
            caddy.cache-to=type=gha,mode=max,scope=askbar-caddy
      - name: Start a throwaway stack
        run: |
          cp .env.example .env
          mkdir -p data
          sudo chown 10002:10002 data
          docker compose up -d --no-build --wait --wait-timeout 300
      # The check that waits five minutes for a stopped gateway to raise component_silent runs on a push to main and on a manual
      # run, not on a pull request (it is about half of this job; its header says why that is safe).
      - name: Isolation checks
        env:
          ASKBAR_SLOW_CHECKS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: scripts/check-isolation.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile dev down --remove-orphans --volumes

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny finds deny.toml beside the manifest or in a parent directory, so both runs use the root one.
      - name: cargo deny (services)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: cargo deny (desktop client)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: clients/desktop/Cargo.toml
          command: check
      # `cargo deny` must still fail on a known-vulnerable dependency (ADR 0017, D30): a crate pinned to one is made in .deny-fixture (from
      # tests/fixtures/deny), and the step that checks it is expected to fail. If it passes, `cargo deny` has stopped catching them.
      - name: Known-vulnerable fixture
        run: scripts/check-deny-fixture.sh prepare
      - name: cargo deny (the fixture must fail)
        id: fixture
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: .deny-fixture/Cargo.toml
          command: check advisories
      - name: The fixture failed, as it must
        if: steps.fixture.outcome == 'success'
        run: |
          echo "cargo deny passed on a crate with a known vulnerability: it is not catching them" >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm licenses
        run: node scripts/check-npm-licenses.js package-lock.json clients/desktop/package-lock.json
      - name: npm advisories
        run: |
          npm audit --audit-level=high
          npm --prefix clients/desktop audit --audit-level=high

  # Trivy scans every image the stack runs, built from this checkout, for known vulnerabilities in its operating system packages and
  # libraries (ADR 0017, D30). A finding with a fix fails the job; one with no fix yet is not reported (--ignore-unfixed); an ignore is in
  # .trivyignore.yaml with a statement and an expiry date. It also runs weekly (the `schedule` above): a new advisory fails that run, and
  # GitHub's email for a failed scheduled run is the CVE alert (turn the notification on, see CONTRIBUTING.md). Trivy is installed by a
  # pinned action at a pinned version; the mock LLM of the dev profile is not scanned (it is an image of Python's, for tests only).
  images:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stack != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same build as the isolation job, from the same cache, so a run that follows it builds little.
      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            *.cache-from=type=gha,scope=askbar-build
            caddy.cache-from=type=gha,scope=askbar-caddy
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Scan the images
        run: |
          failed=0
          for image in bootstrap server admin auditor model-gateway alerter caddy cpa; do
            echo "== askbar-$image"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml \
              --exit-code 1 --no-progress "askbar-$image:latest" || failed=1
          done
          exit $failed

  # The management API of the pinned CLIProxyAPI image still answers as the admin expects (login addresses, wrong-state answers, the
  # account list): `scripts/check-cpa-image.sh`, which its own header says to run after changing the pinned digest. No account is
  # needed; it only pulls the image.
  cpa-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stack != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned CLIProxyAPI image
        run: scripts/check-cpa-image.sh

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks, verified by checksum
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
      - name: Scan the history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
