openapi: 3.0.3
info:
  title: Askbar controller API
  version: 1.0.0
  description: >
    What the admin calls on the controller, the one container that holds the Docker socket. It is on the internal
    `control` network with the admin and is never routed publicly. Every call except `health` carries
    `Authorization: Bearer <controller token>`. Only the services `server`, `caddy` and `cpa` of the controller's own
    Compose project can be named. Errors are `application/problem+json`, as in the other APIs.
paths:
  /api/control/v1/health:
    get:
      operationId: health
      summary: Up. No token needed.
      responses:
        '200':
          description: ok
  /api/control/v1/services:
    get:
      operationId: listServices
      summary: Each allowed service and how it is doing.
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceState'
        '401':
          description: Missing or wrong token (`unauthorized`).
        '502':
          description: Docker could not be reached (`server_unavailable`).
  /api/control/v1/services/{name}/{action}:
    post:
      operationId: controlService
      summary: Start, stop or restart a service.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [server, caddy, cpa]
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, restart]
      responses:
        '200':
          description: The service after the action. Already being in the wanted state counts as done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceState'
        '401':
          description: Missing or wrong token (`unauthorized`).
        '404':
          description: Not an allowed service or action, or no single container for it (`not_found`).
        '502':
          description: Docker could not be reached or refused (`server_unavailable`).
components:
  schemas:
    ServiceState:
      type: object
      required: [name, state, status, health]
      properties:
        name:
          type: string
        state:
          type: string
        status:
          type: string
        health:
          type: string
          nullable: true
