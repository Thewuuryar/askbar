        host:
          type: string
        path:
          type: string
        status:
          type: integer
        bytes:
          type: integer
        duration_ms:
          type: integer
        remote_ip:
          type: string
        proto:
          type: string
        user_agent:
          type: [string, 'null']
    PruneRecord:
      type: object
      required: [at, cutoff, spans, payloads]
      properties:
