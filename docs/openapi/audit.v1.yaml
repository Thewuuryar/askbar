openapi: 3.1.0
info:
  title: Askbar audit API
  version: 1.0.0
  summary: What services and the admin call on the auditor. Internal.
  description: |
    The API under `/api/audit/v1`, served by the `auditor` on a port reachable only from the `audit-*` networks,
    one for each caller. **It is never public**: Caddy has no route to it. It is documented so the services and
    the auditor can be changed with confidence, not for outside callers (ADR 0051, ADR 0010).

    Every request except `GET /health` carries `Authorization: Bearer <token>`. There is one token for each
    link: `server-auditor`, `model-gateway-auditor`, `model-gateway-auditor-read`, `admin-auditor-append` and `admin-auditor-read`. The
    auditor holds only each token's SHA-256, in `auditor-token/accept/<link>.sha256`, read on every request.
    A link may call only its own routes (`403 forbidden` otherwise), and **the caller of a record is the one its
    token belongs to, never anything in a body**.

    - Service links (`server-auditor`, `model-gateway-auditor`): `hello`, spans, finish and payload records, and the
      configuration version a service applied.
      Only `model-gateway-auditor` opens model-call spans (`turn`, `attempt`, `tool`, `agent_step`); the
      server's link opens `gate` spans only.
    - `model-gateway-auditor-read`: `GET /token-counts` and `GET /status`, so the gateway can hold the budget against what
      was used. It appends nothing and reads no trace, content or admin record.
    - `admin-auditor-append`: `hello` and admin action records. It reads and changes nothing.
    - `admin-auditor-read`: every read, the chain head and its check, Caddy's access lines, retention, the backup public key and the encrypted export. It appends nothing.
    - **Caddy's access lines** do not use this API or a token. Caddy's `net` log writer cannot send one, so the auditor takes
      them on an ingest listener of its own, bound to its address on `audit-caddy`, a network of Caddy and the auditor alone
      (ADR 0051). The listener reads newline-delimited JSON and never answers. This API is not bound on that network.
    - No token changes or deletes a record; there is no such route.

    An append is answered after the record is committed. Appending the same record twice records it once,
    so a caller whose answer was lost sends it again. When the auditor is behind its backlog limit (1,000
    queued records, or the oldest waiting over 5 s), every append is refused, and below 256 MiB free disk a new
    span is refused: `503 audit_backlog` with `Retry-After`, and nothing is recorded. Model work stops rather
    than go unrecorded (ADR 0010 rule 3).

    Content only ever arrives and leaves sealed (ADR 0011): the auditor has no key, and no route returns text.

    Every error is a problem (`application/problem+json`), and none echoes what it was sent. See
    [docs/architecture.md](../architecture.md).
servers:
  - url: http://auditor:8083
    description: The auditor on whichever `audit-*` network the caller shares with it.
security:
  - linkToken: []
paths:
  /api/audit/v1/health:
    get:
      operationId: getHealth
      summary: The auditor is up. Needs no token and carries nothing.
      security: []
      responses:
        '200':
          description: OK.
  /api/audit/v1/status:
    get:
      operationId: getStatus
      summary: Which process this is.
      description: >-
        `boot_id` is new on every start of the process. `config_version` is always null: the auditor takes no
        pushed configuration. `last_requests` is when each link last made a request that passed the token check, in
        unix seconds, by the caller its token stands for (`server`, `model-gateway`, `admin`, `admin-read`,
        `model-gateway-read`, `alerter`); a link that has not called since the auditor started is absent. It is how
        the alert rules tell a silent link from a quiet one, and it is in memory only. Any link may call it.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [config_version, boot_id]
                properties:
                  config_version:
                    type: 'null'
                  boot_id:
                    type: string
                  last_requests:
                    type: object
                    additionalProperties:
                      type: integer
                  access_lines_dropped:
                    type: integer
                  access_lines_refused:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/audit/v1/hello:
    post:
      operationId: hello
      summary: A service announces the boot ID of the process now talking.
      description: >-
        That service's earlier unfinished spans (from other processes) end as `interrupted` (ADR 0010 rule 6).
        Spans it appends afterwards carry this boot ID. Service and admin append links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hello'
      responses:
        '200':
          description: How many spans were interrupted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/spans:
    post:
      operationId: startSpan
      summary: A span has begun. Acknowledged after the commit.
      description: >-
        The id is the caller's, so a retry records it once. `model-gateway-auditor` may open any kind; the
        server's link only `gate` (`403` otherwise). Refused below the disk floor as well as at the backlog limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpanStart'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/spans/{id}/finish:
    post:
      operationId: finishSpan
      summary: How a span ended. Only the first finish of a span counts.
      parameters:
        - $ref: '#/components/parameters/SpanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpanFinish'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/spans/{id}/payloads:
    post:
      operationId: addPayload
      summary: Sealed content for a span. Ciphertext only.
      description: Service links. The same sealed bytes for the same span and role are one payload.
      parameters:
        - $ref: '#/components/parameters/SpanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealedPayload'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Backlog'
    get:
      operationId: getPayloads
      summary: The sealed payloads of one span, as stored.
      description: Ciphertext in base64. Only the holder of the audit passphrase can open it, and not here. `admin-auditor-read` only.
      parameters:
        - $ref: '#/components/parameters/SpanId'
      responses:
        '200':
          description: The payloads, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/audit/v1/config-applied:
    post:
      operationId: addConfigApplied
      summary: The configuration version a service now runs. `server-auditor`, `model-gateway-auditor` and `alerter-auditor` only.
      description: >-
        Stored with the admin action records, as category `config`, action `applied`, outcome `done`, with the version
        in `detail`. The caller recorded is the token's (ADR 0028 rule 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigApplied'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/admin-actions:
    post:
      operationId: addAdminAction
      summary: Something the admin did, or refused to do. `admin-auditor-append` only.
      description: >-
        A claim: the services that applied a change record it themselves (ADR 0010). The caller recorded is
        the token's, not the body's. Never changed or deleted afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionStart'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
    get:
      operationId: listAdminActions
      summary: Admin action records, newest first. `admin-auditor-read` only.
      parameters:
        - name: before
          in: query
          description: The id of the last record already seen.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminActionRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/alert-deliveries:
    post:
      operationId: addAlertDelivery
      summary: How one alert ended. `alerter-auditor` only.
      description: >-
        Metadata only (ADR 0055): the kind, the channel (`ntfy` or `email`), the outcome (`sent`, `failed` or
        `suppressed`) and how many tries it took. Never the alert's sentence or its fields. The caller recorded is the
        token's, not the body's, and a body with another field is refused. The same id twice is one record. Never
        changed or deleted, and chained with the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDeliveryStart'
      responses:
        '201':
          $ref: '#/components/responses/Appended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
    get:
      operationId: listAlertDeliveries
      summary: Alert delivery records, newest first. `admin-auditor-read` only.
      parameters:
        - name: before
          in: query
          description: The id of the last record already seen.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertDeliveryRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/traces:
    get:
      operationId: listTraces
      summary: One summary per generation, newest first. `admin-auditor-read` only.
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: before
          in: query
          description: >-
            Only traces older than this trace id (ids sort by time). The cursor for "load more".
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The traces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/traces/{id}:
    get:
      operationId: getTrace
      summary: Every span of one generation, in the order they began.
      parameters:
        - name: id
          in: path
          required: true
          description: The trace (generation) id.
          schema:
            type: string
      responses:
        '200':
          description: The spans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Span'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/audit/v1/stats:
    get:
      operationId: getStats
      summary: Counts, error rate, latency percentiles and token totals since a time. Every cost is null.
      description: >-
        The auditor holds no prices; whoever shows cost applies them. `since` defaults to the last 24 hours. Each row
        of `by_provider` and `by_day` has `requests_with_tokens` (how many of its requests have counts), and
        `by_day_provider` gives the tokens for each day and provider, so each day can be priced exactly.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/token-counts:
    get:
      operationId: getTokenCounts
      summary: What was used since a time, by provider and model. Counts only. `admin-auditor-read` and `model-gateway-auditor-read`.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: One row for each provider and model.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/access-logs:
    get:
      operationId: listAccessLogs
      summary: Caddy's access lines, newest first. `admin-auditor-read` only.
      description: >-
        One row for each request Caddy handled, taken on the ingest listener (not part of this API, see the top of this
        file): the time, method, host, path without its query, status, bytes, duration, client address, protocol and a cut
        user agent. No header and no query string is kept.
      parameters:
        - name: before
          in: query
          description: The id of the last row already seen.
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/prunes:
    get:
      operationId: listPrunes
      summary: Every time retention deleted records, oldest first.
      description: Each prune is recorded in the same transaction as its delete.
      responses:
        '200':
          description: The prunes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PruneRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/chain/head:
    get:
      operationId: getChainHead
      summary: The newest entry of the hash chain. `admin-auditor-read` only.
      description: >-
        The number and hash of the newest entry (`0` and 64 zeros for an empty chain). The admin keeps it and checks it
        against the auditor later (ADR 0010 rule 7).
      responses:
        '200':
          description: The head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/chain/entries/{id}:
    get:
      operationId: getChainEntry
      summary: The hash of one entry of the chain. `admin-auditor-read` only.
      description: A hash that is not the one the admin stored for this number means the chain was rewritten.
      parameters:
        - name: id
          in: path
          required: true
          description: The entry's number.
          schema:
            type: integer
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/audit/v1/chain/verify:
    get:
      operationId: verifyChain
      summary: A full check of the chain and of every record against it. `admin-auditor-read` only.
      description: >-
        Reads the whole store: every link, every record against its digest, records with no entry, and records that are
        gone with no prune to explain them. At most 20 problems are listed; `more` says whether there were others.
      responses:
        '200':
          description: What the check found. `ok` is false when there is at least one problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/audit/v1/retention:
    get:
      operationId: getRetention
      summary: How long sealed content is kept. `admin-auditor-read` only.
      responses:
        '200':
          description: The setting and its floor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: setRetention
      summary: Set how long records are kept. Never below 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Retention'
      responses:
        '200':
          description: The setting now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retention'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/backup-key:
    put:
      operationId: setBackupKey
      summary: Give the auditor the backup public key its export is encrypted to. `admin-auditor-read` only.
      description: >-
        ADR 0013. The key is a public one (`age1...`), kept as a setting of the store; the same key again records nothing. The admin
        gives it with each export, so a rotation or a restart leaves no old key behind. A value that is not a backup public key is
        400 `bad_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupKey'
      responses:
        '200':
          description: The key was taken (or was already the key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyTaken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
  /api/audit/v1/export:
    get:
      operationId: getExport
      summary: The store, encrypted to the backup public key and streamed. `admin-auditor-read` only.
      description: >-
        ADR 0013. A tar with one file, `audit.db`: a consistent copy (`VACUUM INTO`, taken from a read-only connection so the writer is
        never blocked), encrypted with age to the backup public key and written to the response as it is made. It holds sealed content
        only. The response has no length: a transfer that ends early ends the connection badly, which is how the admin knows it is not
        whole. The copy is made on the audit volume, one export at a time, and removed however the export ends. With no key,
        503 `backup_key_missing`. With less room than the copy needs plus the floor kept for open spans, or while another export runs,
        503 `audit_backlog` and nothing is made.
      responses:
        '200':
          description: An age file that opens to a tar of `audit.db`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Backlog'
components:
  securitySchemes:
    linkToken:
      type: http
      scheme: bearer
      description: The token of one link. Only its SHA-256 is on the auditor.
  parameters:
    SpanId:
      name: id
      in: path
      required: true
      description: The span id, as the caller chose it.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Since:
      name: since
      in: query
      description: Unix seconds.
      schema:
        type: integer
  responses:
    Appended:
      description: Committed. The id it is stored under.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Appended'
    BadRequest:
      description: The body or a parameter could not be used (`bad_request`). The answer does not repeat it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or unknown token (`unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: This link may not call this route, or open this kind of span (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such span or trace (`not_found`). Also any unknown path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Backlog:
      description: >-
        The auditor is behind its backlog limit, or low on disk for a new span (`audit_backlog`). Nothing was
        recorded; try again after `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: >-
        An error, as RFC 9457 problem details (application/problem+json). Branch on `error`, never on
        `detail`.
      required: [type, title, status, detail, error]
      additionalProperties: true
      properties:
        type:
          type: string
          description: A URN, `urn:askbar:problem:<error>`; nothing is hosted at it.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A sentence for a person.
        error:
          type: string
          description: The stable code.
          enum:
          - queue_full
          - budget_exceeded
          - kill_switch
          - user_paused
          - model_not_approved
          - audit_key_missing
          - backup_key_missing
          - backup_newer_release
          - not_empty
          - audit_backlog
          - client_too_old
          - client_version_missing
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - bad_request
          - payload_too_large
          - too_many_attempts
          - api_key_exists
          - setup_required
          - not_configured
          - password_change_required
          - server_unavailable
          - conflict
          - internal
    SpanKind:
      type: string
      enum: [turn, gate, attempt, tool, agent_step]
    Hello:
      type: object
      required: [boot_id]
      properties:
        boot_id:
          type: string
    HelloResult:
      type: object
      required: [interrupted]
      properties:
        interrupted:
          type: integer
    Appended:
      type: object
      required: [id]
      properties:
        id:
          type: string
    SpanStart:
      type: object
      required: [id, trace_id, kind, name, started_at, started_ms]
      properties:
        id:
          type: string
        trace_id:
          type: string
          description: The generation id; every span of one reply shares it.
        parent_id:
          type: string
        kind:
          $ref: '#/components/schemas/SpanKind'
        name:
          type: string
        started_at:
          type: integer
          description: Unix seconds.
        started_ms:
          type: integer
          description: Unix milliseconds.
        provider_id:
          type: string
        model:
          type: string
        user_id:
          type: string
        client_id:
          type: string
        attrs:
          type: object
          additionalProperties: true
          description: Small metadata only (at most 16 KB).
    SpanFinish:
      type: object
      required: [status, ended_at, ended_ms]
      properties:
        status:
          type: string
          description: Anything but `running`.
        ended_at:
          type: integer
        ended_ms:
          type: integer
        provider_id:
          type: string
        model:
          type: string
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        tokens_cached:
          type: integer
        ttft_ms:
          type: integer
        error_code:
          type: string
        attrs:
          type: object
          additionalProperties: true
    SealedPayload:
      type: object
      required: [role, key_id, ciphertext_b64]
      properties:
        role:
          type: string
        key_id:
          type: string
        ciphertext_b64:
          type: string
          contentEncoding: base64
    StoredPayload:
      type: object
      required: [role, key_id, ciphertext_b64]
      properties:
        role:
          type: string
        key_id:
          type: string
        ciphertext_b64:
          type: string
          contentEncoding: base64
    AdminActionStart:
      type: object
      required: [id, at, category, action, outcome]
      properties:
        id:
          type: string
        at:
          type: integer
        category:
          type: string
        action:
          type: string
        outcome:
          type: string
          enum: [requested, done, refused, failed]
          description: >-
            `requested` is written before the change, so a record that cannot be written refuses it; `done`, `refused`
            (the admin said no) or `failed` (it tried and did not succeed) follow and name the request in `detail`.
        detail:
          type: object
          additionalProperties: true
          description: Metadata about the change, never a secret or message content.
    ConfigApplied:
      type: object
      required: [id, at, version]
      properties:
        id:
          type: string
        at:
          type: integer
        version:
          type: integer
    AlertDeliveryStart:
      type: object
      additionalProperties: false
      required: [id, at, kind, channel, outcome, attempts]
      properties:
        id:
          type: string
        at:
          type: integer
        kind:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          description: The kind of alert, as the alerter names it.
        channel:
          type: string
          enum: [ntfy, email]
        outcome:
          type: string
          enum: [sent, failed, suppressed]
        attempts:
          type: integer
          minimum: 0
          maximum: 1000
    AlertDeliveryRecord:
      type: object
      required: [id, at, caller, kind, channel, outcome, attempts]
      properties:
        id:
          type: string
        at:
          type: integer
        caller:
          type: string
          description: Which token appended it.
        kind:
          type: string
        channel:
          type: string
        outcome:
          type: string
        attempts:
          type: integer
    AdminActionRecord:
      type: object
      required: [id, at, service, category, action, outcome, detail]
      properties:
        id:
          type: string
        at:
          type: integer
        service:
          type: string
          description: Which token appended it.
        category:
          type: string
        action:
          type: string
        outcome:
          type: string
        detail:
          type: [object, 'null']
          additionalProperties: true
    Retention:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 7
          maximum: 3650
        floor_days:
          type: integer
          description: The least it can be set to. Returned, not sent.
    BackupKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The backup public key, `age1...`.
    BackupKeyTaken:
      type: object
      required: [fingerprint, changed]
      properties:
        fingerprint:
          type: string
          description: The key's short name (four groups of four hex digits).
        changed:
          type: boolean
          description: False if the auditor already had this key.
    TraceSummary:
      type: object
      required: [trace_id, span_id, status, started_at]
      additionalProperties: true
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        status:
          type: string
        started_at:
          type: integer
        ended_at:
          type: [integer, 'null']
        user_id:
          type: [string, 'null']
        client_id:
          type: [string, 'null']
        tokens_in:
          type: [integer, 'null']
        tokens_out:
          type: [integer, 'null']
        tokens_cached:
          type: [integer, 'null']
        error_code:
          type: [string, 'null']
        provider_id:
          type: [string, 'null']
        model:
          type: [string, 'null']
        ttft_ms:
          type: [integer, 'null']
        latency_ms:
          type: [integer, 'null']
    Span:
      type: object
      required: [id, kind, name, status, started_at, sealed]
      additionalProperties: true
      properties:
        id:
          type: string
        parent_id:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/SpanKind'
        name:
          type: string
        status:
          type: string
        started_at:
          type: integer
        ended_at:
          type: [integer, 'null']
        provider_id:
          type: [string, 'null']
        model:
          type: [string, 'null']
        tokens_in:
          type: [integer, 'null']
        tokens_out:
          type: [integer, 'null']
        tokens_cached:
          type: [integer, 'null']
        ttft_ms:
          type: [integer, 'null']
        error_code:
          type: [string, 'null']
        user_id:
          type: [string, 'null']
        client_id:
          type: [string, 'null']
        attrs:
          type: [object, 'null']
          additionalProperties: true
        sealed:
          type: integer
          description: How many sealed payloads it has.
    TokenCount:
      type: object
      required: [provider_id, model, requests, tokens_in, tokens_out, tokens_cached]
      properties:
        provider_id:
          type: [string, 'null']
        model:
          type: [string, 'null']
        requests:
          type: integer
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        tokens_cached:
          type: integer
    ChainEntry:
      type: object
      required: [seq, hash]
      properties:
        seq:
          type: integer
        hash:
          type: string
          description: 64 hex characters.
    ChainReport:
      type: object
      required: [ok, entries, head, problems, more]
      properties:
        ok:
          type: boolean
        entries:
          type: integer
        head:
          $ref: '#/components/schemas/ChainEntry'
        problems:
          type: array
