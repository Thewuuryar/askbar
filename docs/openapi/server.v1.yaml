openapi: 3.1.0
info:
  title: Askbar server API
  version: 1.0.0
  summary: What the admin service calls on the server. Internal.
  description: |
    The API under `/api/server/v1`, served only on the server's internal listener (an address on the
    `server-api` network that only the admin joins). **It is never public**: Caddy has no route to it and
    answers 404, and the client API's listener does not serve it. It is documented so the admin service and
    the server can be changed with confidence, not for outside callers.

    Every request carries `Authorization: Bearer <server token>`. The admin holds the token; the server
    holds only its SHA-256, in a file it mounts read-only, read on every request. A missing or unreadable
    hash file refuses everything (fail closed).

    Every error is a problem (`application/problem+json`). See [docs/architecture.md](../architecture.md).
servers:
  - url: http://server-api-host:8082
    description: The server's address on the internal network, as set in compose.yaml.
security:
  - serverToken: []
paths:
  /api/server/v1/health:
    get:
      operationId: getHealth
      summary: The server API is up and the token is right.
      responses:
        '200':
          description: OK.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/server/v1/status:
    get:
      operationId: getStatus
      summary: Which configuration this process runs, and which process it is.
      description: >-
        `config_version` is the version of the last configuration accepted (null before the first push).
        `boot_id` is new on every start of the process. The admin pushes again when either is not what it
        expects (ADR 0028). Changes nothing.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [config_version, boot_id]
                properties:
                  config_version:
                    type: [integer, 'null']
                  boot_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/server/v1/restart:
    post:
      operationId: restart
      summary: Restart the server (ADR 0005).
      description: >-
        Answers 202 with the boot ID of the process that is about to stop, saves what running replies have so far
        (they end as interrupted), and exits within 10 seconds; Docker's restart policy starts it again with a new
        boot ID. Refused with 429 `too_many_attempts` (and `Retry-After`) during the first 30 seconds after a start.
      responses:
        '202':
          description: Restarting.
          content:
            application/json:
              schema:
                type: object
                required: [boot_id]
                properties:
                  boot_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too soon after a start (`too_many_attempts`, with `Retry-After`).
        '500':
          $ref: '#/components/responses/Internal'
  /api/server/v1/config:
    put:
      operationId: putConfig
      summary: Replace the configuration snapshot.
      description: >-
        Everything the server needs from the admin to run, as one document (providers, system prompt, display
        defaults, pairing codes, revoked clients, budgets, kill switch, generation timeout, audit retention and
        the audit public key). The version in the body is ignored; the server assigns the next one. A snapshot
        with the kill switch on acts at once on what is queued or running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snapshot'
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
  /api/server/v1/providers/health:
    get:
      operationId: getProvidersHealth
      summary: Providers the gateway found unusable (bad credentials).
      description: >
        Only flagged providers are listed; the reason is a code such as `http_401`, never the provider's own text.
        The server holds no provider keys (ADR 0054), so whether one is missing is the admin's to say.
      responses:
        '200':
          description: Flagged providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [provider_id, status, since]
                      properties:
                        provider_id:
                          type: string
                        status:
                          type: string
                          enum: [auth_failed]
                        since:
                          type: integer
                        error_code:
                          type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/server/v1/users:
    get:
      operationId: listUsers
      summary: The users, oldest first. Pairing codes are made for one of these.
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/server/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteUser
      summary: Delete a user, their personal space file, their clients and the hashes of their tokens.
      description: >-
        Replies still running in the personal space are stopped first. A shared space the user belonged to stays, with
        what they wrote in it; they are no longer a member. The user's clients are refused (401) from then on. The audit
        records stay (ADR 0012). Nothing is deleted if the space file cannot be removed.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/server/v1/clients:
    get:
      operationId: listClients
      summary: Every paired client, newest first. A token is never shown; only its hash is stored.
      responses:
        '200':
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, user_id, name, created_at, last_seen, revoked]
                  properties:
                    id:
                      type: string
                    user_id:
                      type: string
                    name:
                      type: string
                    created_at:
                      type: integer
                    last_seen:
                      type: [integer, 'null']
                    revoked:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/server/v1/usage:
    get:
      operationId: getUsage
      summary: Counts for the admin's overview.
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  conversations:
                    type: integer
                  messages:
                    type: integer
                  clients:
                    type: object
                    properties:
                      active:
                        type: integer
                      revoked:
                        type: integer
                  tokens_in:
                    type: integer
                  tokens_out:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/server/v1/exports:
    post:
      operationId: createExport
      summary: The server's data, encrypted to the backup public key and streamed.
      description: >-
        ADR 0013. Consistent copies (`VACUUM INTO`) of the control database and of every space's file, as a tar with `control.db` and
        `spaces/<space id>.db` for every space (ADR 0009), encrypted with age to the backup public key in the last snapshot and written
        to the response as it is made. The export is complete, secrets included (client token hashes, pairing codes), because only the
        owner's passphrase opens it. The response has no length: a transfer that ends early ends the connection badly, which is how the
        admin knows it is not whole (it cannot decrypt to check). Work files are on the data volume, one copy at a time, and are
        removed however the export ends. With no backup key in the snapshot (or one that is not a public key) nothing is exported:
        503 `backup_key_missing`.
      responses:
        '200':
          description: An age file that opens to a tar of SQLite files.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: There is no backup key (`backup_key_missing`), or the server has no settings yet (`not_configured`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    serverToken:
      type: http
      scheme: bearer
      description: The server token the admin holds. Only its SHA-256 is on the server.
  parameters:
    ProviderId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body, a parameter or a header could not be used (`bad_request`, `client_version_missing`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, unknown or revoked credentials (`unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such thing, or not yours (`not_found`). Also any unknown path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: The server failed (`internal`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: >-
        An error, as RFC 9457 problem details (application/problem+json). Branch on `error`, never on
        `detail`. Extension members (for example `period`) may be present.
      required: [type, title, status, detail, error]
      additionalProperties: true
      properties:
        type:
          type: string
          description: A URN, `urn:askbar:problem:<error>`; nothing is hosted at it.
          examples: ["urn:askbar:problem:not_found"]
        title:
          type: string
          description: Fixed for each code.
        status:
          type: integer
        detail:
          type: string
          description: A sentence for a person.
        error:
          type: string
          description: The stable code.
          enum:
          - queue_full
          - budget_exceeded
          - kill_switch
          - user_paused
          - model_not_approved
          - audit_key_missing
          - backup_key_missing
          - audit_backlog
          - client_too_old
          - client_version_missing
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - bad_request
          - payload_too_large
          - too_many_attempts
          - api_key_exists
          - setup_required
          - not_configured
          - password_change_required
          - server_unavailable
          - conflict
          - internal
    Snapshot:
      type: object
      description: >-
        The configuration the admin pushes. See `crates/askbar-proto/src/lib.rs` (`Snapshot`) for every field and
        docs/wire-contract.md for what the server does with them. Unknown fields are ignored.
      required: [audit_retention_days]
      additionalProperties: true
      properties:
        version:
          type: integer
        providers:
          type: array
          items:
            type: object
            additionalProperties: true
        default_provider_id:
          type: [string, 'null']
        system_prompt:
          type: [string, 'null']
        display:
          type: object
          additionalProperties: true
        user_display_defaults:
          type: object
          additionalProperties: true
        pair_codes:
          type: array
          items:
            type: object
            additionalProperties: true
        revoked_client_ids:
          type: array
          items:
            type: string
        budget:
          type: object
          properties:
            daily_tokens:
              type: [integer, 'null']
            monthly_tokens:
              type: [integer, 'null']
        kill_switch:
          type: boolean
        kill_switch_aborts_running:
          type: boolean
        audit_retention_days:
          type: integer
          minimum: 7
        generation_timeout_secs:
          type: integer
          minimum: 30
          maximum: 3600
        history_turns:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            How many earlier questions, each with its reply, are sent with a new one. 0, or absent,
            sends the whole conversation.
        audit_public_key:
          type: [object, 'null']
          properties:
            key_id:
              type: string
            public_key:
              type: string
              description: 64 hex characters (32 bytes).
