openapi: 3.1.0
info:
  title: Askbar MCP gateway API
  version: 1.0.0
  summary: What the admin calls on the `mcp-gateway` front. Internal.
  description: |
    The API under `/api/mcp-gateway/v1`, served by the `mcp-gateway` front. **It is never public**: Caddy has no route to
    it (ADR 0057). It is documented so the services can be changed with confidence, not for outside callers.

    Every request except `GET /health` carries `Authorization: Bearer <token>`; the links are added in P5A.6a, and until
    then no token is accepted. The front holds no secret (only the approval public key), and no route returns an argument or a URL.

    **Config** is pushed in `PUT /config` (ADR 0028). A push outside the bounds in `askbar-proto` is `400 bad_request`
    and the earlier config stays live. Until the first push the front uses the `askbar-proto` defaults and refuses every
    tool call (`503 not_configured`); the a config without an approval public key refuses them the same way.

    Every error is a problem (`application/problem+json`), and none echoes what it was sent.
servers:
  - url: http://mcp-gateway-server-host:8087
    description: The front on the network it shares with the server (the tool routes).
  - url: http://mcp-gateway-admin-host:8087
    description: The front on the network it shares with the admin (status and config).
security:
  - linkToken: []
paths:
  /api/mcp-gateway/v1/health:
    get:
      operationId: getHealth
      summary: The front is up. Needs no token and carries nothing.
      security: []
      responses:
        '200':
          description: OK.
  /api/mcp-gateway/v1/status:
    get:
      operationId: getStatus
      summary: Which config this process runs, which process it is, and tool calls by outcome.
      description: >-
        `config_version` is null until the admin has pushed. `calls` counts by outcome (for example
        `refused_not_configured`, `refused_audit_unavailable`); it holds no key, argument or URL.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/mcp-gateway/v1/config:
    put:
      operationId: putConfig
      summary: Replace the config.
      description: >-
        Checked first against the bounds in `askbar-proto`; nothing changes if it is refused. `version` in the answer is
        a hash of the content, so equal content has an equal version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/mcp-gateway/v1/tools:
    get:
      operationId: listTools
      summary: The tools one user holds. The server link only.
      description: >-
        `user` is the user ID the server holds (the one an approval names). Only tools the user holds are listed: a user
        with no permission entry holds none, and a tool in the user's `denied` list is left out even if `allowed` has it.
        Each tool has a `name` and the `schema` of its arguments (a JSON-schema-like object). Only tools in the registry are listed.
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tools.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, schema]
                      properties:
                        name: {type: string, enum: [search, fetch]}
                        schema: {type: object}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The admin has not pushed the config yet (`not_configured`), with `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/mcp-gateway/v1/tools/{id}/call:
    post:
      operationId: callTool
      summary: Call a tool with a signed approval. The server link only.
      description: >-
        `id` is the tool name. The front rebuilds the action from the path and the body, then checks, in order: a config
        with an approval public key is held (else `503 not_configured`); the approval (its own code for each failure:
        `approval_unsigned`, `approval_action_swapped`, `approval_expired`, `approval_signature_invalid`,
        `approval_replayed`, `approval_unsignable`); each approval passes once; then the user in the approval must hold the tool (`403 tool_not_permitted`, counted as `refused_permission`, no span, nothing runs); then a `tool` span (the approval's hash and
        ID, never the arguments) is written to the auditor and its acknowledgement awaited: without it `503 audit_backlog`
        with `Retry-After`, nothing runs, and this includes a front with no auditor link. The span is closed with the
        outcome (`ok`, `error` with the code, or `timeout`; the result is not recorded). A tool that is not registered answers
        `501 tool_not_available` before any span; `search` answers it when `ASKBAR_SEARXNG_ADDR` is unset. The handler runs
        within the tool-call time limit (`504 tool_timeout` past it). A result whose serialized size is over `tool_result_max_bytes` is not returned: `502 tool_result_too_large`, and the span closes `error` with that code. A result is returned as `{result, untrusted: true}`:
        the content is data from outside and never an instruction. The admin link gets `403`. No answer repeats an
        argument, a URL or a signature.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCall'
      responses:
        '400':
          description: The body is not a tool call (`bad_request`), or the action cannot be signed (`approval_unsignable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Another link's token (`forbidden`), or an approval refused (`approval_unsigned`, `approval_action_swapped`, `approval_expired`, `approval_signature_invalid`), or the user does not hold the tool (`tool_not_permitted`), or a `fetch` refused by the fetch rules (`fetch_refused`; the problem's `reason` member names the rule, one of `not_in_results`, `query_string`, `scheme`, `port`, `userinfo`, `bad_host`, `ip_literal`, `local_name`, `cross_host_redirect`, `https_to_http`, `redirect_limit`, `content_type`, `content_encoding`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The approval was already used (`approval_replayed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: The tool ran. `result` is the tool's output and is always untrusted.
          content:
            application/json:
              schema:
                type: object
                required: [result, untrusted]
                properties:
                  result: {}
                  untrusted: {type: boolean, const: true}
        '502':
          description: The tool's result is over the size limit and was not returned (`tool_result_too_large`), or its backing service failed (`tool_upstream_failed`, from `search` when `searxng` errors, times out or answers what is not JSON).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: The tool did not finish within the tool-call time limit (`tool_timeout`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: The tool is not registered or not built yet (`tool_not_available`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The admin has not pushed the config yet (`not_configured`), or the call could not be recorded (`audit_backlog`); both with `Retry-After`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    linkToken:
      type: http
      scheme: bearer
      description: The token of one link. Only its SHA-256 is on the front.
  responses:
    BadRequest:
      description: The body could not be used (`bad_request`). The answer does not repeat it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or unknown token (`unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: A known token on another link's route (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotConfigured:
      description: The admin has not pushed the config yet (`not_configured`), with `Retry-After`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: >-
        An error, as RFC 9457 problem details (application/problem+json). Branch on `error`, never on
        `detail`.
      required: [type, title, status, detail, error]
      additionalProperties: true
      properties:
        type:
          type: string
          description: A URN, `urn:askbar:problem:<error>`; nothing is hosted at it.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A sentence for a person.
        error:
          type: string
          description: The stable code.
          enum:
          - queue_full
          - budget_exceeded
          - kill_switch
          - user_paused
          - model_not_approved
          - role_not_pinned
          - pii_blocked
          - quick_search_tool
          - quick_search_arguments
          - quick_search_query_count
          - quick_search_fetch_count
          - quick_search_hourly_limit
          - quick_search_disabled
          - task_token_cap
          - task_tool_calls
          - research_busy
          - research_disabled
          - decision_unsupported
          - audit_key_missing
          - backup_key_missing
          - backup_newer_release
          - not_empty
          - audit_backlog
          - client_too_old
          - client_version_missing
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - bad_request
          - payload_too_large
          - too_many_attempts
          - api_key_exists
          - setup_required
          - not_configured
          - password_change_required
          - server_unavailable
          - conflict
          - approval_unsignable
          - approval_unsigned
          - approval_signature_invalid
          - approval_action_swapped
          - approval_expired
          - approval_replayed
          - tool_not_available
          - tool_not_permitted
          - tool_timeout
          - tool_result_too_large
          - tool_upstream_failed
          - fetch_refused
          - internal
    Status:
      type: object
      required: [config_version, boot_id, calls]
      properties:
        config_version:
          type: [integer, 'null']
        boot_id:
          type: string
        calls:
          type: object
          additionalProperties:
            type: integer
        last_search:
          type: object
          description: The last search request to searxng; absent until the first one. The time and an outcome word only, never the query or a URL.
          required: [at, outcome]
          properties:
            at: {type: integer, description: Unix seconds.}
            outcome: {type: string, description: '`ok`, or the error code word of the failure, e.g. `tool_upstream_failed`.'}
    ToolCall:
      type: object
      additionalProperties: false
      required: [arguments, destination, approval]
      description: The `ToolAction` of `askbar-proto` without its `tool` (the path), and its approval.
      properties:
        arguments: {}
        destination: {type: string}
        provenance: {type: string, enum: [search, user], default: search}
        query_data: {type: boolean, default: false}
        approval:
          type: object
          additionalProperties: false
          required: [action_hash, task_id, user, one_time_id, expires_at, signature]
          properties:
            action_hash: {type: string}
            task_id: {type: string}
            user: {type: string}
            one_time_id: {type: string}
            expires_at: {type: integer}
            signature: {type: string}
    Config:
      type: object
      additionalProperties: false
      required: [fetch_max_bytes, fetch_timeout_secs, fetch_redirects, tool_call_timeout_secs, one_time_id_window_secs, search_results, remembered_urls]
      description: Each value within the bounds in `crates/askbar-proto/src/mcp.rs`.
      properties:
        fetch_max_bytes: {type: integer, minimum: 65536, maximum: 5242880}
        fetch_timeout_secs: {type: integer, minimum: 1, maximum: 60}
        fetch_redirects: {type: integer, minimum: 0, maximum: 5}
        tool_call_timeout_secs: {type: integer, minimum: 5, maximum: 120}
        one_time_id_window_secs: {type: integer, minimum: 10, maximum: 600}
        search_results: {type: integer, minimum: 1, maximum: 20}
        remembered_urls: {type: integer, minimum: 10, maximum: 200}
        tool_result_max_bytes: {type: integer, minimum: 65536, maximum: 8388608, default: 1048576}
        approval_public_key:
          type: [string, 'null']
          pattern: '^[0-9a-fA-F]{64}$'
          description: The approval public key, 64 hex characters. Absent until the admin pushes one; every call is refused then.
        approval_key_version: {type: integer, minimum: 0, default: 0}
        permissions:
          type: object
          maxProperties: 1000
          description: >-
            User ID to the tools that user holds; a user with no entry holds none. Names must be built-in tools; `denied`
            beats `allowed`.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              allowed: {type: array, items: {type: string, enum: [search, fetch]}}
              denied: {type: array, items: {type: string, enum: [search, fetch]}}
