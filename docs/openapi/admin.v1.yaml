openapi: 3.1.0
info:
  title: Askbar admin API
  version: 1.0.0
  summary: The admin site's API, for the site and for your own scripts.
  description: |
    The API under `/api/admin/v1`, served by `askbar-admin` at `https://<host>/api/admin/v1`. The admin site is
    a client of it; you can write your own. Every error is a problem (`application/problem+json`). Within `v1`
    changes are additive only. See [docs/architecture.md](../architecture.md).

    **Two ways in.**
    - *A session* (the site): `POST /session` with the admin password sets the `__Secure-askbar_admin` cookie
      (Secure, HttpOnly, SameSite=Strict, Path=/api/admin). Send the cookie, and on any change also the header
      `X-Askbar-Admin: 1`. A change whose `Sec-Fetch-Site` is anything but `same-origin` or `none` is refused
      (403 `forbidden`), whatever it carries (ADR 0029).
    - *An admin API key* (scripts): make one in the site (Security tab); it is shown once. Send it as
      `Authorization: Bearer <key>`. No cookie and no `X-Askbar-Admin` header. A key can use every operation
      that lists `adminApiKey` below. The operations marked session-only (the session, the password, the keys, sealed content)
      refuse a key, so a leaked key cannot make more keys or lock you out. One key is active at a time; revoke
      it from the site. A wrong key counts toward the same lockout as a wrong password.

    The site's own files (`/admin/`, `app.js`, ...) are not part of the API. If the admin's address allowlist
    is on, requests from other addresses never arrive.
servers:
  - url: https://askbar.example.com
    description: Your server's host name. Before one is set, https://<the Docker host's address>, with the install's own certificate.
security:
  - adminSession: []
  - adminApiKey: []
paths:
  /api/admin/v1/health:
    get:
      operationId: getHealth
      summary: The admin service is up.
      security: []
      responses:
        '200':
          description: OK.
  /api/admin/v1/setup:
    get:
      operationId: getSetup
      summary: Which first-run screens are done (booleans only).
      security: []
      responses:
        '200':
          description: State.
          content:
            application/json:
              schema:
                type: object
                required: [password_change_required, audit_key_set]
                properties:
                  password_change_required:
                    type: boolean
                    description: The published first-run password (ADR 0007) is still in use and must be changed.
                  audit_key_set:
                    type: boolean
  /api/admin/v1/session:
    post:
      operationId: signIn
      summary: Sign in as `admin` with the admin password.
      description: >-
        On a first start (and after the host command `askbar-admin reset`) the login is the published one,
        `admin` / `admin` (ADR 0007), and every signed-in route except this one, `GET` and `DELETE
        /session` and `PUT /password` answers 403 `password_change_required` until the password is changed.
        `username` is optional; a wrong username and a wrong password get the same answer. Sets the
        `__Secure-askbar_admin` session cookie (Secure, HttpOnly, SameSite=Strict, Path=/api/admin). Five wrong attempts in 15 minutes lock sign-in out for 15 minutes (429 with Retry-After); wrong admin API keys count toward the same lock.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordBody'
      responses:
        '204':
          description: Signed in.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooMany'
        '503':
          $ref: '#/components/responses/SetupRequired'
    get:
      operationId: getSession
      summary: Is this session signed in?
      security:
        - adminSession: []
      responses:
        '204':
          description: Yes.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: signOut
      summary: Sign out.
      security:
        - adminSession: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/password:
    put:
      operationId: changePassword
      summary: Change the admin password. Other sessions are signed out.
      description: >-
        At least 10 characters, and not the published first-run password, the username (`admin`) or the
        current password (400). Clears `password_change_required`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /api/admin/v1/cpa:
    get:
      operationId: getCpa
      summary: Whether CLIProxyAPI answers, the accounts connected to it, and the provider made for it.
      description: Session-only. `provider_id` is null until an account is connected.
      security:
        - adminSession: []
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema:
                type: object
                required: [configured, reachable, accounts, provider_id]
                properties:
                  configured:
                    type: boolean
                  reachable:
                    type: boolean
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/CpaAccount'
                  provider_id:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/cpa/logins:
    post:
      operationId: startCpaLogin
      summary: Start connecting a Claude or ChatGPT account.
      description: >
        Session-only. Open `url` in a browser and approve. The browser then lands on a `localhost` address that
        will not load when the admin is on another machine; paste that whole address into
        `POST /cpa/logins/{state}/callback`. A login expires after 10 minutes.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [anthropic, openai]
      responses:
        '200':
          description: Where to go.
          content:
            application/json:
              schema:
                type: object
                required: [url, state, expires_in]
                properties:
                  url:
                    type: string
                  state:
                    type: string
                  expires_in:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/cpa/logins/{state}:
    parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCpaLogin
      summary: How a login is going (`wait`, `ok` or `error`).
      description: Session-only. On `ok` the CPA provider is made if it was not, and its id is returned.
      security:
        - adminSession: []
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, provider_id]
                properties:
                  status:
                    type: string
                    enum: [wait, ok, error]
                  message:
                    type: string
                  provider_id:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/cpa/logins/{state}/callback:
    parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: finishCpaLogin
      summary: Give the address the browser ended up on after approving.
      description: >
        Session-only. The address must be a `localhost` or `127.0.0.1` address carrying this login's `state` and a
        `code`. A wrong address is a 400 and the login stays open; a good one is used once.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_url]
              properties:
                redirect_url:
                  type: string
      responses:
        '200':
          description: Sent to CLIProxyAPI. Poll the login for the result.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/cpa/accounts/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeCpaAccount
      summary: Disconnect an account.
      security:
        - adminSession: []
      responses:
        '204':
          description: Disconnected.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/services:
    get:
      operationId: listServices
      summary: How the server, the admin, Caddy and CLIProxyAPI are doing, and the last ten restarts.
      description: Session-only. Each state comes from the service itself (the server's status, Caddy's admin socket, CLIProxyAPI's API); there is no controller (ADR 0005).
      security:
        - adminSession: []
      responses:
        '200':
          description: The services and recent actions.
          content:
            application/json:
              schema:
                type: object
                required: [services, recent]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceState'
                  recent:
                    type: array
                    items:
                      type: object
                      required: [service, action, at, ok]
                      properties:
                        service:
                          type: string
                        action:
                          type: string
                        at:
                          type: integer
                          description: Unix seconds.
                        ok:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/services/{name}/restart:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum: [server, model-gateway, admin, caddy, cpa]
    post:
      operationId: restartService
      summary: Restart a service, without a controller (ADR 0005).
      description: >
        Session-only: an admin API key cannot do this. Every attempt is recorded first, and at most 6 are allowed
        per minute (429 `too_many_attempts`). `server`: asks the server's own `POST /restart` and waits until a new
        process answers (a new boot ID), at most a minute; replies being written end as interrupted, and the
        server's 30-second cooldown after it starts is passed on as 429. `model-gateway` (ADR 0054): asks its
        `POST /restart`, waits for a new boot ID, then pushes its configuration, provider keys included, since they
        were in the memory that went; its cooldown is passed on the same way. `admin`: answers 202 and exits; this page
        reconnects when Docker has started it again. `caddy`: pushes its configuration again, which Caddy applies
        live. `cpa`: asks its supervisor (ADR 0037) and waits for CLIProxyAPI to answer again, at most a minute.
      security:
        - adminSession: []
      responses:
        '200':
          description: The service after the restart (server, model-gateway, caddy, cpa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceState'
        '202':
          description: The admin is restarting itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/keys:
    get:
      operationId: listKeys
      summary: The admin API key that can be used, by name. Never the key or its hash.
      security:
        - adminSession: []
      responses:
        '200':
          description: Zero or one key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createKey
      summary: Make the admin API key. It is shown once, in this answer.
      description: "One key at a time: while one is active this is 409 `api_key_exists`. A key can use the API except for the routes marked session-only (keys, the password, the session)."
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewKey'
      responses:
        '201':
          description: The key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeKey
      summary: Revoke the key. It stops working at once.
      security:
        - adminSession: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/v1/status:
    get:
      operationId: getStatus
      summary: Is the server reachable, and is a change waiting to be pushed?
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_online:
                    type: boolean
                  pending:
                    type: boolean
                  error:
                    type: [string, 'null']
                  token_rejected:
                    type: boolean
                    description: The server answers 401 to this admin's token. Clears with the next answer that is not a 401.
                  sealed_content:
                    type: object
                    description: >-
                      The banner's part, which is whether this browser has a sealed-content session and how long it has
                      left, and the alerts of the last day (an unseal, a change of the timeouts). Never a key or content.
                    properties:
                      open:
                        type: boolean
                      idle_left_secs:
                        type: [integer, 'null']
                      total_left_secs:
                        type: [integer, 'null']
                      alerts:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            at:
                              type: integer
                            text:
                              type: string
                  audit_chain:
                    type: object
                    description: >-
                      What the admin's check of the auditor's hash chain found (ADR 0010 rule 7). The check compares the
                      chain's head with the one the admin stored, every five minutes, and asks for a full check of every
                      record about once an hour.
                    required: [state, detail]
                    properties:
                      state:
                        type: string
                        enum: [unknown, ok, rollback, rewritten, edited]
                        description: >-
                          `unknown` before the first check or while the auditor has not answered; `rollback` when the
                          chain is shorter than the stored head; `rewritten` when the stored entry is gone or has another
                          hash; `edited` when records no longer match their entries.
                      detail:
                        type: string
                        description: A sentence for the banner; empty unless something is wrong. It never holds a record's content.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/providers:
    get:
      operationId: listProviders
      summary: The providers, by name. A key is never shown, only whether the server holds one.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProvider
      summary: Add a provider. The key is sent to the server, not kept here.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateProvider
      summary: Change a provider. A missing or empty `api_key` keeps the current key.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      responses:
        '204':
          description: Saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
    delete:
      operationId: deleteProvider
      summary: Delete a provider. Its approved models leave the catalog with it.
      description: >
        Refused with `409 conflict` while the provider's model is the catalog's default and other models are approved:
        choose another default first.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/catalog:
    get:
      operationId: getCatalog
      summary: The approved models and the default.
      description: >
        The models people may use (ADR 0014), in the order they were saved, and the one that answers when a message
        names none. A new install has none approved, and nothing answers until some are.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putCatalog
      summary: Replace the approved models and the default.
      description: >
        One change: the whole list and its default. Every model names an existing provider, none is listed twice, and a
        catalog with any model needs a default that is one of them (`400` otherwise). Pick models from what
        `POST /providers/models` returns for each provider. The gateway has the new catalog within a moment; the
        change is recorded like every other.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Catalog'
      responses:
        '200':
          description: Saved. The catalog as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/providers/models:
    post:
      operationId: listProviderModels
      summary: Ask a provider which models it offers.
      description: >
        The server asks the provider (it has the keys and the network); nothing is saved. Give `api_key`
        (used once) or a saved `provider_id` whose stored key may be used when the type and address match.
        A failure at the provider is a 200 with `ok: false` and a `message`.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [openai, anthropic]
                base_url:
                  type: string
                api_key:
                  type: string
                provider_id:
                  type: string
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message, models]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  models:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id:
                          type: string
                        label:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/providers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: testProvider
      summary: Stream a short fixed message through the provider and report how it went.
      description: >
        Pass or fail, the time to the first text, and a details view of the request: its method and path, the status
        code, an error type and the timings. The message is always the gateway's own words: the reply, a provider's error
        text and the key are never in it. Nothing of the result is stored; the audit record is metadata only (a turn
        span named `provider_test`). A test that could not be recorded in time sends nothing (`error_type: audit`).
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/clients:
    get:
      operationId: listClients
      summary: The paired apps, newest first.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    user_id:
                      type: string
                      description: The user it belongs to (`GET /users`).
                    name:
                      type: string
                    created_at:
                      type: integer
                    last_seen:
                      type: [integer, 'null']
                    revoked:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/clients/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeClient
      summary: Revoke a paired app. Its token gets 401 from then on.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/users:
    get:
      operationId: listUsers
      summary: The users, oldest first (ADR 0008).
      description: >-
        The first time the admin has none, it takes over the server's users (an install from before users were
        made here has one, `owner`, with its paired clients), so those clients keep working.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, created_at, paused]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    created_at:
                      type: integer
                    paused:
                      type: boolean
                      description: Replies are stopped for this user (the emergency stop for one person).
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createUser
      summary: Make a user; it reaches the server with the rest of the configuration.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 1 to 60 characters, unique.
      responses:
        '201':
          description: Made.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/users/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: pauseUser
      summary: Stop one person's replies, new and running (the emergency stop for one person).
      description: >-
        Pushed to the server (which refuses new replies early) and to the gateway (which is authoritative and stops the
        replies running). Recorded like every change. Nothing the person has is deleted; resume undoes it.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '204':
          description: Paused.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/users/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resumeUser
      summary: Undo a pause so the person's replies work again.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '204':
          description: Resumed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/users/{id}/pairing-keys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createPairingKey
      summary: A one-time pairing key that registers one app for this user (good for ten minutes).
      description: The user's other apps can then be paired from a paired app (client API `POST /me/pairing-keys`).
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairInput'
      responses:
        '200':
          description: The pairing key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingOut'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/setup/audit-key:
    put:
      operationId: setupAuditKey
      summary: "First run: make the audit key from a passphrase (at least 20 characters)."
      description: The passphrase is turned into a keypair and forgotten. 409 if a key exists (rotation is its own action).
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAuditKey'
      responses:
        '200':
          description: The key id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/settings:
    get:
      operationId: getSettings
      summary: System prompt, display defaults, timeout, kill switch, audit retention.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putSettings
      summary: Save settings. A field left out keeps its stored value.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettings'
      responses:
        '204':
          description: Saved and pushed to the server.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/users/{id}/display-defaults:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: putUserDisplayDefaults
      summary: Display defaults for one user.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplaySettings'
      responses:
        '204':
          description: Saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/network:
    get:
      operationId: getNetwork
      summary: Host name, HTTPS and allowlist settings, and how the last attempt to configure Caddy went.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putNetwork
      summary: "Save them. The Cloudflare token is write-only: left out or empty keeps the stored one."
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInput'
      responses:
        '200':
          description: Saved (and applied to Caddy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/network/apply:
    post:
      operationId: applyNetwork
      summary: Send the saved settings to Caddy again.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: How it went.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/backup:
    get:
      operationId: getBackup
      summary: One .tar with the server's files (server/control.db, server/spaces/<space id>.db) and admin.db, consistent and without secrets.
      description: Provider API keys, pairing-code hashes, the Cloudflare token, the admin password hash and the API key hash are left out.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: A tar file.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/audit/traces:
    get:
      operationId: listTraces
      summary: One summary per generation, newest first (from the auditor; metadata only).
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Traces.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/audit/traces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTrace
      summary: Every span of one generation.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Spans.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/audit/stats:
    get:
      operationId: getStats
      summary: Counts, error rate, latency, tokens and cost.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/audit/provider-health:
    get:
      operationId: getProviderHealth
      summary: Providers the router found unusable.
      security:
        - adminSession: []
        - adminApiKey: []
      responses:
        '200':
          description: Flagged providers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/audit/access:
    get:
      operationId: listAuditAccess
      summary: Who opened sealed content and when (never the content), newest first.
      security:
        - adminSession: []
        - adminApiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 500
            default: 100
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/v1/audit/rotate-key:
    post:
      operationId: rotateAuditKey
      summary: Make a new audit key from a new passphrase; the old one is retired but kept.
      security:
        - adminSession: []
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateKey'
      responses:
        '200':
          description: The ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    type: string
                  retired_key_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          $ref: '#/components/responses/ServerUnavailable'
  /api/admin/v1/audit/session:
    get:
      operationId: getUnsealSession
      summary: Whether sealed content is open for this browser, and for how long.
      description: >-
        Not an unseal and not a use: asking does not keep a session alive. The session belongs to the browser session
        that started it; an admin API key has none (ADR 0011).
      security:
        - adminSession: []
      responses:
        '200':
          description: The state of the session and the key registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsealSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: startUnsealSession
      summary: Open sealed content with the audit passphrase, after a fresh sign-in.
      description: >-
        The passphrase must be entered within ten minutes of signing in (`403` otherwise). Each key in the registry the
        passphrase makes is derived and kept in memory for the session; nothing is stored. A wrong passphrase is `403`,
        recorded in the access history, and five wrong ones in 15 minutes lock unsealing out (`429`). The request is
        recorded in the auditor before it is handled; if that fails the answer is `503` and nothing is opened. A
        passphrase for an older key, given during a session, adds that key (`200`) without restarting its clock.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRequest'
      responses:
        '200':
          description: Keys were added to the session that was already open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsealSession'
        '201':
          description: A session was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsealSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooMany'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
    delete:
      operationId: sealAgain
      summary: Seal. Drops the keys at once.
      security:
        - adminSession: []
      responses:
        '204':
          description: Sealed (also when nothing was open).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
  /api/admin/v1/audit/payloads/{span_id}:
    parameters:
      - name: span_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: viewAuditPayloads
      summary: The content of one span, opened with the session's keys.
      description: >-
        Needs an open session (`403` when sealed). Each view counts as use, is written to the access history, and is
        recorded in the auditor before it is made. A payload sealed with a key the session does not hold has
        `text: null` and names the key with its created and retired dates, so the person knows which passphrase it needs.
      security:
        - adminSession: []
      responses:
        '200':
          description: The plain content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  span_id:
                    type: string
                  payloads:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuditorUnavailable'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: askbar_admin
      description: Set by `POST /session`. Changes also need the header `X-Askbar-Admin` set to `1`.
    adminApiKey:
      type: http
      scheme: bearer
      description: The admin API key (`askbar-admin-...`).
  responses:
    BadRequest:
      description: The body, a parameter or a header could not be used (`bad_request`, `client_version_missing`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, unknown or revoked credentials (`unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such thing, or not yours (`not_found`). Also any unknown path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: The server failed (`internal`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: "Not allowed: the browser header is missing, or a passphrase or password is wrong (`forbidden`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state (`conflict`, `api_key_exists`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Too many attempts (`too_many_attempts`, with `Retry-After`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerUnavailable:
      description: The admin cannot reach the Askbar server (`server_unavailable`); nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuditorUnavailable:
      description: The admin cannot reach the auditor, so the audit trail cannot be read now (`setup_required`); nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SetupRequired:
      description: Setup is not finished (`setup_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CpaAccount:
      type: object
      required: [name, provider, label]
      properties:
        name:
          type: string
        provider:
          type: string
          enum: [anthropic, openai]
        label:
          type: string
    ServiceState:
      type: object
      required: [name, state, status, health]
      properties:
        name:
          type: string
          enum: [server, model-gateway, admin, caddy, cpa]
        state:
          type: string
          description: Whether it answers (`running`), does not (`unreachable`), or is restarting itself (`restarting`, the admin only).
          enum: [running, unreachable, restarting]
        status:
          type: string
          description: A sentence for a person.
        health:
          type: 'null'
          description: Always null; kept so the shape stays the same.
    Problem:
      type: object
      description: >-
        An error, as RFC 9457 problem details (application/problem+json). Branch on `error`, never on
        `detail`. Extension members (for example `period`) may be present.
      required: [type, title, status, detail, error]
      additionalProperties: true
      properties:
        type:
          type: string
          description: A URN, `urn:askbar:problem:<error>`; nothing is hosted at it.
          examples: ["urn:askbar:problem:not_found"]
        title:
          type: string
          description: Fixed for each code.
        status:
          type: integer
        detail:
          type: string
          description: A sentence for a person.
        error:
          type: string
          description: The stable code.
          enum:
          - queue_full
          - budget_exceeded
          - kill_switch
          - user_paused
          - model_not_approved
          - audit_key_missing
          - audit_backlog
          - client_too_old
          - client_version_missing
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - bad_request
          - payload_too_large
          - too_many_attempts
          - api_key_exists
          - setup_required
          - not_configured
          - password_change_required
          - server_unavailable
          - conflict
          - internal
    PasswordBody:
      type: object
      required: [password]
      properties:
        username:
          type: string
          description: Optional; `admin` when given.
        password:
          type: string
    ChangePassword:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
        new:
          type: string
          minLength: 10
    NewKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    KeyRow:
      type: object
      required: [id, name, scope, created_at, last_used_at]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [admin]
          description: Only `admin` exists so far; later scopes (for example audit logs only) will be added.
        created_at:
          type: integer
        last_used_at:
          type: [integer, 'null']
    CreatedKey:
      allOf:
        - $ref: '#/components/schemas/KeyRow'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Shown once. Nothing returns it again.
    ProviderRow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [openai, anthropic]
        base_url:
          type: string
        model:
          type: string
        max_tokens:
          type: [integer, 'null']
        temperature:
          type: [number, 'null']
        has_key:
          type: boolean
        billing:
          type: string
          enum: [metered, subscription]
        price_in:
          type: [number, 'null']
        price_out:
          type: [number, 'null']
        price_cached_in:
          type: [number, 'null']
        managed:
          type: boolean
          description: Made and kept in step by the admin (the CLIProxyAPI provider). Name, type, address and key are fixed and it cannot be deleted; the model and limits can change.
        key_missing:
          type: boolean
          description: The server reports it holds no key for this provider, though one was sent. Enter the key again. Never true for the managed provider.
    ProviderTest:
      type: object
      required: [ok, message, ttft_ms, details]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: A sentence of the gateway's own. Never the reply, a provider's words or the key.
        ttft_ms:
          type: [integer, 'null']
          description: Milliseconds from sending the request to the first text, on a pass.
        details:
          type: object
          required: [method, path, status, error_type, ttft_ms, total_ms]
          properties:
            method:
              type: string
            path:
              type: string
              description: The request's path only, with no host, query or credentials.
            status:
              type: [integer, 'null']
              description: The HTTP status of the answer, when there was one.
            error_type:
              type: [string, 'null']
              enum: [connect, auth, not_found, rate_limited, rejected, provider_error, http_error, stream, config, empty, timeout, audit, null]
            ttft_ms:
              type: [integer, 'null']
            total_ms:
              type: integer
    Catalog:
      type: object
      required: [models, default]
      properties:
        models:
          type: array
          items:
            type: object
            required: [provider_id, model]
            properties:
              provider_id:
                type: string
              model:
                type: string
                description: The model's own name, 1 to 200 characters. It may contain slashes.
        default:
          type: [string, 'null']
          description: "`provider/model` of one of `models`. Present exactly when `models` is not empty."
    ProviderInput:
      type: object
      required: [name, type, model]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [openai, anthropic]
        base_url:
          type: string
        model:
          type: string
        api_key:
          type: string
          description: Write-only. Missing or empty on update keeps the current key.
        max_tokens:
          type: integer
        temperature:
          type: number
        billing:
          type: string
          enum: [metered, subscription]
        price_in:
          type: number
        price_out:
          type: number
        price_cached_in:
          type: number
    PairInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
    PairingOut:
      type: object
      required: [pairing, expires_in]
      properties:
        pairing:
          type: string
          description: '`askbar-pair:` plus base64url JSON of the server address and a one-time code.'
        expires_in:
          type: integer
          description: Seconds.
    SetupAuditKey:
      type: object
      required: [passphrase, confirm]
      properties:
        passphrase:
          type: string
          minLength: 20
        confirm:
          type: string
    RotateKey:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
        new:
          type: string
          minLength: 20
        confirm:
          type: string
    UnsealSession:
      type: object
      required: [open, keys]
      properties:
        open:
          type: boolean
        idle_left_secs:
          type: [integer, 'null']
        total_left_secs:
          type: [integer, 'null']
        idle_limit_secs:
          type: integer
        total_limit_secs:
          type: integer
        fresh_signin_secs_left:
          type: [integer, 'null']
          description: How long this sign-in can still start a session.
        keys:
          type: array
          description: The key registry, oldest first, and which keys the session holds.
          items:
            type: object
            required: [key_id, created_at, open]
            properties:
              key_id:
                type: string
              created_at:
                type: integer
              retired_at:
                type: [integer, 'null']
              open:
                type: boolean
    OpenRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: string
    DisplaySettings:
      type: object
      properties:
        theme:
          type: string
          enum: [auto, light, dark]
        width:
          type: integer
        max_height:
          type: integer
        history_width:
          type: integer
        top_percent:
          type: number
        hide_on_blur:
          type: boolean
        newest_first:
          type: boolean
          description: >-
            Show a conversation newest first, just under the input bar, each question still above
            its reply. False (oldest first) when absent.
    AdminSettings:
      type: object
      required: [system_prompt, display]
      properties:
        system_prompt:
          type: string
        display:
          $ref: '#/components/schemas/DisplaySettings'
        generation_timeout_secs:
          type: integer
          minimum: 30
          maximum: 3600
        history_turns:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            How many earlier questions, each with its reply, are sent with a new one; 0 sends the
            whole conversation (the default). Left out of a save, the stored value is kept.
        kill_switch:
          type: boolean
        kill_switch_aborts_running:
          type: boolean
        audit_retention_days:
          type: integer
          minimum: 7
          maximum: 3650
        unseal_idle_minutes:
          type: integer
          minimum: 1
          maximum: 720
          description: Minutes without use before sealed content seals itself (default 15). May not exceed the total. Changing it is an alert.
        unseal_total_minutes:
          type: integer
          minimum: 1
          maximum: 720
          description: Minutes in all before sealed content seals itself, however it is used (default 60). Changing it is an alert.
        audit_key_id:
          type: [string, 'null']
          readOnly: true
    NetworkInput:
      type: object
      required: [tls_enabled, hostname, admin_cidr, acme_staging]
      properties:
        tls_enabled:
          type: boolean
        hostname:
          type: string
        admin_cidr:
          type: string
          description: Space- or comma-separated addresses and CIDRs.
        acme_staging:
          type: boolean
        allowlist_enabled:
          type: boolean
        cloudflare_token:
          type: string
          description: Write-only. Missing or empty keeps the stored token.
        clear_token:
          type: boolean
    NetworkView:
      allOf:
        - $ref: '#/components/schemas/NetworkInput'
        - type: object
          properties:
            has_token:
              type: boolean
            public_url:
              type: string
              description: What new pairing keys point at.
            proxy:
              type: object
              properties:
                ok:
                  type: boolean
                message:
                  type: string
                at:
                  type: integer
