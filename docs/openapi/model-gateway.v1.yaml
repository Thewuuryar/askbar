openapi: 3.1.0
info:
  title: Askbar model-gateway API
  version: 1.0.0
  summary: What the server and the admin call on `model-gateway`. Internal.
  description: |
    The API under `/api/model-gateway/v1`, served by `model-gateway` on two listeners, one on the network it shares
    with the server (`gateway-server`) and one on the network it shares with the admin (`gateway-admin`). **It is
    never public**: Caddy has no route to it, and the gateway joins no network Caddy is on. It is documented so
    the services can be changed with confidence, not for outside callers (ADR 0054, ADR 0014).

    Every request except `GET /health` carries `Authorization: Bearer <token>`. There is one token for each link:
    `server-model-gateway` and `admin-model-gateway`. The gateway holds only each token's SHA-256, in
    `model-gateway-token/accept/<link>.sha256`, read on every request. Each listener takes only its own link's
    token and serves only its own routes:

    - the server's listener: `POST /chat`, `GET /catalog`, `POST /approvals/quick-search`, `POST /approvals/research` and `POST /decide`;
    - the admin's listener: `GET /status`, `PUT /config`, `POST /restart`, `POST /models` and
      `POST /providers/{id}/test` (they moved here from the server, which has no keys and no route out).

    **Keys.** The admin pushes provider keys in `PUT /config`. The gateway keeps them in memory only. No route
    returns one, and no error repeats one. A restart is how a key leaves memory; the admin pushes again when it
    sees the new boot ID in `GET /status` or in the auditor (ADR 0028).

    **A reply.** `POST /chat` appends the turn span to the auditor and waits for its acknowledgment (one second at
    most) before it calls a provider. With no acknowledgment it answers `503 audit_backlog` and calls nothing.
    The answer is a Server-Sent Events stream: one `span` event, then `delta` and `usage` events, then one `done`
    or one `error`. The server adds its sealed payloads and the turn's finish record to the span it was given.
    Provider error text is never in the stream: the gateway seals it to the audit public key and sends it to the
    auditor (ADR 0011). The stream's `error` event carries a code and a class only.

    Every error is a problem (`application/problem+json`), and none echoes what it was sent. See
    [docs/architecture.md](../architecture.md).
servers:
  - url: http://gateway-server-host:8084
    description: The gateway on the network it shares with the server.
  - url: http://gateway-admin-host:8084
    description: The gateway on the network it shares with the admin.
security:
  - linkToken: []
paths:
  /api/model-gateway/v1/health:
    get:
      operationId: getHealth
      summary: The gateway is up. Needs no token and carries nothing. Both listeners.
      security: []
      responses:
        '200':
          description: OK.
  /api/model-gateway/v1/status:
    get:
      operationId: getStatus
      summary: Which configuration this process runs, and which process it is. The admin's listener.
      description: >-
        `config_version` is null until the admin has pushed. `boot_id` is new on every start of the process. The
        admin pushes again when either is not what it expects.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [config_version, boot_id, task_cap_75, task_cap_90]
                properties:
                  config_version:
                    type: [integer, 'null']
                  boot_id:
                    type: string
                  task_cap_75:
                    type: integer
                    description: Tasks that have used 75% of the token cap since this process started. A count; no task or user is named.
                  task_cap_90:
                    type: integer
                    description: The same for 90%.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/model-gateway/v1/config:
    put:
      operationId: putConfig
      summary: Replace the configuration, provider keys included. The admin's listener.
      description: >-
        Replaces the whole of the earlier configuration. The keys are held in memory only. The answer holds none.
        A body that cannot be used (no audit public key, a key id that is not the key's, a duplicate provider id, a
        type other than `openai` or `anthropic`) is refused and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayConfig'
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/model-gateway/v1/restart:
    post:
      operationId: restart
      summary: Stop the process; Docker starts it again. The admin's listener.
      description: >-
        The answer is `202` with the boot ID of the process that is about to stop. A restart within 30 seconds of
        a start is refused with `429 too_many_attempts`. Nothing is on disk, so the keys leave memory with it.
      responses:
        '202':
          description: Stopping.
          content:
            application/json:
              schema:
                type: object
                required: [boot_id]
                properties:
                  boot_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Started too recently (`too_many_attempts`).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/model-gateway/v1/models:
    post:
      operationId: listModels
      summary: The models a provider offers. The admin's listener.
      description: >-
        Asks the provider's own model list, from here, where the keys and the route out are. Always `200`: when it
        could not say, `ok` is false and `message` says why in a sentence that never holds the key. A saved
        provider's key is used only when the request names it and gives no key, and only for the address saved with
        it, so the key can never be sent somewhere the saved provider does not point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelsRequest'
      responses:
        '200':
          description: The list, or why there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/model-gateway/v1/providers/{id}/test:
    post:
      operationId: testProvider
      summary: A short fixed message, streamed through a saved provider, and how it went. The admin's listener.
      description: >-
        Streams one short fixed message through the provider as configured (30 seconds at most) with the provider's own
        model, and reports pass or fail, the time to the first text and a details view of the request. Always `200` for
        a provider that exists. Nothing of the reply, a provider's error text or the key is in the answer, and nothing
        of it is stored: the audit record is a metadata-only turn span named `provider_test`, on record before the
        provider is called (when it cannot be made in time, nothing is sent and `error_type` is `audit`).
      parameters:
        - name: id
          in: path
          required: true
          description: The provider id.
          schema:
            type: string
      responses:
        '200':
          description: How it went.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/model-gateway/v1/catalog:
    get:
      operationId: getCatalog
      summary: The approved models and the default. The server's listener.
      description: >-
        What the administrator approved (ADR 0014), as the server offers it to clients and checks a send against. An
        install that has approved nothing yet answers with an empty list and no default.
      responses:
        '200':
          description: The approved models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The gateway has no configuration yet (`not_configured`). Try again after `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/model-gateway/v1/chat:
    post:
      operationId: chat
      summary: One generation, streamed. The server's listener.
      description: >-
        The turn span is on record before a provider is called. Each try at a provider is an attempt span, also on
        record before it. A failing provider is tried up to three times in all when the failure is the kind that
        can clear, and never once text has been sent. Closing the connection cancels the request in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: >-
            A Server-Sent Events stream. The `event:` line names the event and `data:` holds the JSON of the
            matching `ChatEvent`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatEvent'
        '400':
          description: >-
            The body could not be used (`bad_request`), or the model is not one the catalog approves for this provider
            (`model_not_approved`). Nothing was called. The second is a `blocked` `model_catalog` gate span in the
            generation's trace. Or, with PII in `enforce` mode, the system text or a message holds a value the settings
            block (`pii_blocked`; the problem's `types` member lists the type names, never a value). The refusal is a
            `blocked` `pii_block` gate span in the trace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: >-
            A research task (a request whose `role` is a task role, with the generation id as the task id) has used its
            token cap (`task_token_cap`). Nothing was called. The refusal is a `blocked` `task_token_cap` gate span in
            the generation's trace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The administrator paused replies for this user (`user_paused`). Nothing was called. The refusal is a `blocked`
            `user_pause` gate span in the generation's trace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: >-
            A token budget is used up (`budget_exceeded`, with `period`: `daily` or `monthly`). The gateway's own copy of
            the budget is the authoritative one; the server holds a copy to refuse early. Nothing was called, and the
            refusal is a `blocked` `budget` gate span with the numbers.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            Nothing was called. Either the gateway has no configuration yet (`not_configured`), the kill switch is on
            (`kill_switch`), or the audit record could not be made in time (`audit_backlog`: the auditor is unreachable,
            did not acknowledge in one second, or refused; also when the gateway has not yet read how many tokens were
            used and a budget applies). Try again after `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/model-gateway/v1/approvals/quick-search:
    post:
      operationId: approveQuickSearch
      summary: Sign one quick search call by fixed rules. The server's listener.
      description: >-
        No model is called and none judges: the gateway refuses or signs by fixed rules (plan W5.2). Refused when the
        quick search is turned off (`503 quick_search_disabled`), the kill switch is on (`503 kill_switch`), the user is paused (`403 user_paused`), the tool is not `search` or `fetch`
        (`400 quick_search_tool`), the arguments are not the tool's or a query is over the length limit
        (`400 quick_search_arguments`), the reply has used its searches (`429 quick_search_query_count`) or its fetches
        (`429 quick_search_fetch_count`), or the user has used the hour's searches (`429 quick_search_hourly_limit`). A refusal
        counts for nothing and is a `blocked` `quick_search_approval` gate span; an approval counts once. The approval's
        span (a `gate`, with the tool, the action hash and the one-time ID, never a query or a URL) is acknowledged by the
        auditor before the approval is returned, else `503 audit_backlog` and nothing is signed. The task ID and trace ID are
        the generation ID. The answer carries the `destination`, `provenance` and `query_data` the action was signed with,
        which the caller must send to the MCP gateway unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation_id, user, tool, arguments]
              properties:
                generation_id:
                  type: string
                user:
                  type: string
                tool:
                  type: string
                arguments:
                  type: object
      responses:
        '200':
          description: The signed approval.
          content:
            application/json:
              schema:
                type: object
                required: [approval, destination, provenance, query_data]
                properties:
                  approval:
                    type: object
                    description: The `Approval` (`action_hash`, `task_id`, `user`, `one_time_id`, `expires_at`, `signature`).
                  destination:
                    type: string
                  provenance:
                    type: string
                    enum: [search, user]
                  query_data:
                    type: boolean
        '400':
          description: The body could not be used (`bad_request`), the tool is not `search` or `fetch` (`quick_search_tool`), or the arguments are not allowed (`quick_search_arguments`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is paused (`user_paused`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: A limit is used up (`quick_search_query_count`, `quick_search_fetch_count` or `quick_search_hourly_limit`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No configuration or no approval key yet (`not_configured`), quick search is turned off (`quick_search_disabled`), the kill switch is on (`kill_switch`), or the span was not acknowledged (`audit_backlog`). Nothing was signed.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/model-gateway/v1/approvals/research:
    post:
      operationId: approveResearch
      summary: Sign one research tool call by fixed rules. The server's listener.
      description: >-
        The same rules and shape as the quick search approval (plan P5B.2), held to the task's tool-call limit instead of
        the quick search counts; it does not look at `quick_search_enabled`. No model is called. Refused when research is
        turned off (`503 research_disabled`), the kill switch is on (`503 kill_switch`), the user is paused
        (`403 user_paused`), the tool is not `search` or `fetch` (`400 quick_search_tool`), the arguments are not the
        tool's or a query is over the length limit (`400 quick_search_arguments`), or the task has made its tool calls
        (`429 task_tool_calls`). A refusal counts for nothing and is a `blocked` `research_approval` gate span; an approval
        counts once, and the count is taken back if nothing is signed. The approval's span (a `gate`, with the tool, the
        action hash and the one-time ID, never a query or a URL) is acknowledged by the auditor before the approval is
        returned, else `503 audit_backlog`. The task ID and trace ID are `task_id`. The caller sends the answer's
        `destination`, `provenance` and `query_data` to the MCP gateway unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, user, tool, arguments]
              properties:
                task_id:
                  type: string
                user:
                  type: string
                tool:
                  type: string
                arguments:
                  type: object
      responses:
        '200':
          description: The signed approval.
          content:
            application/json:
              schema:
                type: object
                required: [approval, destination, provenance, query_data]
                properties:
                  approval:
                    type: object
                    description: The `Approval` (`action_hash`, `task_id`, `user`, `one_time_id`, `expires_at`, `signature`).
                  destination:
                    type: string
                  provenance:
                    type: string
                    enum: [search, user]
                  query_data:
                    type: boolean
        '400':
          description: The body could not be used (`bad_request`), the tool is not `search` or `fetch` (`quick_search_tool`), or the arguments are not allowed (`quick_search_arguments`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is paused (`user_paused`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The task has made its tool calls (`task_tool_calls`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No configuration or no approval key yet (`not_configured`), research is turned off (`research_disabled`), the kill switch is on (`kill_switch`), or the span was not acknowledged (`audit_backlog`). Nothing was signed.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/model-gateway/v1/decide:
    post:
      operationId: decide
      summary: The judge reviews a research draft. The server's listener.
      description: >-
        Only `decision: judge` is taken (`step_check` and `research` are `400 decision_unsupported` until P5.8). `input` is
        the `JudgeInput` (`task_id`, `user_id`, `question`, `summaries`, `draft`; unknown fields refused; at most 200 KiB
        of text; `task_id` and `user_id` equal `generation_id` and `user_id`). One model call runs through the same turn path
        as `/chat` with the role `judge.review`, so the pin, the kill switch, the pause, the budget and the task cap apply.
        The `turn` span carries the role, the verdict and the reason code, never text; the prompt and the reply are sealed
        payloads on it. The answer is the verdict: a reply that is not exactly `{"verdict":"approve"}` or
        `{"verdict":"refuse","reason":"<code>"}` is `refuse` with `bad_format`, still `200`. Any other failure is a problem,
        never a verdict, and the caller must treat every non-200 as a refusal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, input, generation_id, user_id]
              properties:
                decision:
                  type: string
                  enum: [judge, step_check, research]
                input:
                  type: object
                generation_id:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                type: object
                required: [decision, output]
                properties:
                  decision:
                    type: string
                    enum: [judge]
                  output:
                    type: object
                    required: [verdict]
                    properties:
                      verdict:
                        type: string
                        enum: [approve, refuse]
                      reason:
                        type: string
                        enum: [unsupported_claim, contradicts_source, off_topic, unsafe, bad_citation, bad_format]
        '400':
          description: The body or input could not be used or is too long (`bad_request`), the decision is not taken yet (`decision_unsupported`), or no model is pinned to `judge.review` (`role_not_pinned`). Nothing was called.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The task has used its token cap (`task_token_cap`). Nothing was called.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The user is paused (`user_paused`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The usage budget is reached (`budget_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The model call did not complete (`internal`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No configuration yet (`not_configured`), research is turned off (`research_disabled`), the kill switch is on (`kill_switch`), or the span was not acknowledged (`audit_backlog`). Nothing was called.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    linkToken:
      type: http
      scheme: bearer
      description: The token of one link. Only its SHA-256 is on the gateway.
  responses:
    BadRequest:
      description: The body could not be used (`bad_request`). The answer does not repeat it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or unknown token (`unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such provider (`not_found`). Also any unknown path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: >-
        An error, as RFC 9457 problem details (application/problem+json). Branch on `error`, never on
        `detail`.
      required: [type, title, status, detail, error]
      additionalProperties: true
      properties:
        type:
          type: string
          description: A URN, `urn:askbar:problem:<error>`; nothing is hosted at it.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: A sentence for a person.
        error:
          type: string
          description: The stable code.
          enum:
          - queue_full
          - budget_exceeded
          - kill_switch
          - user_paused
          - model_not_approved
          - role_not_pinned
          - pii_blocked
          - quick_search_tool
          - quick_search_arguments
          - quick_search_query_count
          - quick_search_fetch_count
          - quick_search_hourly_limit
          - quick_search_disabled
          - task_token_cap
          - task_tool_calls
          - research_busy
          - research_disabled
          - decision_unsupported
          - audit_key_missing
          - backup_key_missing
          - backup_newer_release
          - not_empty
          - audit_backlog
          - client_too_old
          - client_version_missing
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - bad_request
          - payload_too_large
          - too_many_attempts
          - api_key_exists
          - setup_required
          - not_configured
          - password_change_required
          - server_unavailable
          - conflict
          - approval_unsignable
          - approval_unsigned
          - approval_signature_invalid
          - approval_action_swapped
          - approval_expired
          - approval_replayed
          - tool_not_available
          - tool_not_permitted
          - tool_timeout
          - tool_result_too_large
          - tool_upstream_failed
          - fetch_refused
          - internal
    ModelsRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [openai, anthropic]
        base_url:
          type: string
          description: Empty for the provider's own address.
        api_key:
          type: string
          writeOnly: true
          description: Used once for this request; never stored or logged.
        provider_id:
          type: string
          description: A saved provider whose key may be used.
    ModelsResult:
      type: object
      required: [ok, message, models]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: On failure, why. Never holds the key.
        models:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              label:
                type: string
    TestResult:
      type: object
      required: [ok, message, ttft_ms, details]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: A sentence of the gateway's own. Never the reply, a provider's own words or the key.
        ttft_ms:
          type: [integer, 'null']
          description: Milliseconds from sending the request to the first text, on a pass.
        details:
          type: object
          required: [method, path, status, error_type, ttft_ms, total_ms]
          properties:
            method:
              type: string
            path:
              type: string
              description: The request's path only, with no host, query or credentials.
            status:
              type: [integer, 'null']
            error_type:
              type: [string, 'null']
              enum: [connect, auth, not_found, rate_limited, rejected, provider_error, http_error, stream, config, empty, timeout, audit, null]
            ttft_ms:
              type: [integer, 'null']
            total_ms:
              type: integer
    GatewayProvider:
      type: object
      description: One provider. `api_key` is write-only, and no route returns it.
      required: [id, name, type, model]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [openai, anthropic]
        base_url:
          type: string
        model:
          type: string
        max_tokens:
          type: [integer, 'null']
        temperature:
          type: [number, 'null']
        headers:
          type: object
          additionalProperties:
            type: string
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: Empty for a provider that needs none (a local server).
        billing:
          type: string
          enum: [metered, subscription]
          description: How it is paid for. A subscription's tokens do not count toward the budget.
    AuditKey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id:
          type: string
          description: The first 8 bytes of the SHA-256 of the key, in hex.
        public_key:
          type: string
          description: The 32-byte X25519 public key, 64 hex characters.
    GatewayConfig:
      type: object
      required: [version, providers, audit_public_key]
      properties:
        version:
          type: integer
          description: Which configuration this is; `GET /status` reports it back.
        providers:
          type: array
          items:
            $ref: '#/components/schemas/GatewayProvider'
        audit_public_key:
          $ref: '#/components/schemas/AuditKey'
        approval_key:
          type: object
          nullable: true
          description: >-
            The approval signing key (plan step P5.3), held in memory only and never returned. Absent until the admin
            has one; the gateway then signs nothing.
          required: [version, pkcs8]
          properties:
            version:
              type: integer
              description: Changes when the key is rotated.
            pkcs8:
              type: string
              description: The Ed25519 private key, PKCS#8, base64url without padding.
        generation_timeout_secs:
          type: integer
          description: >-
            How long a generation may run. A turn the server has not finished 60 seconds after that is finished
            as `interrupted` by the gateway.
        budget:
          type: object
          description: The token budget, authoritative here (ADR 0014). A subscription provider's tokens do not count.
          properties:
            daily_tokens:
              type: [integer, 'null']
            monthly_tokens:
              type: [integer, 'null']
        kill_switch:
          type: boolean
          description: While on, the gateway starts no reply (`503 kill_switch`).
        kill_switch_aborts_running:
          type: boolean
          description: When the switch is on, also stop the replies already running (the default). They end with the error code `kill_switch`.
        quick_search_enabled:
          type: boolean
          description: Whether quick search is on for everyone (default true when left out). While off, `POST /approvals/quick-search` answers `503 quick_search_disabled`.
        task_limits:
          type: object
          description: >-
            The research task limits, each within its bounds (askbar-proto, `research`). The defaults when left out. A value outside
            its bounds is refused (400).
          properties:
            tool_calls: {type: integer, minimum: 1, maximum: 32, description: Tool calls one task may make in all. Default 8.}
            token_cap: {type: integer, minimum: 20000, maximum: 2000000, description: Tokens one task may use in all. Default 300000.}
            researchers_max: {type: integer, minimum: 2, maximum: 4, description: Researchers that run in parallel. Default 4.}
            wait_after_two_secs: {type: integer, minimum: 1, maximum: 60, description: Seconds to wait for the rest after two summaries. Default 8.}
            stage_secs: {type: integer, minimum: 10, maximum: 600, description: Seconds the research stage may take. Default 90.}
            summary_tokens: {type: integer, minimum: 100, maximum: 4000, description: Tokens one researcher's summary may have. Default 800.}
        research_enabled:
          type: boolean
          description: Whether research is on for everyone. On when absent.
        pii:
          type: object
          description: >-
            The PII settings (plan PII-P1.1, askbar-proto `pii`). Detection is off when absent, in `detect_only` mode, with the
            default action for each type. Left out of the configuration while it is the default. A value outside its bounds is refused (400).
          properties:
            enabled: {type: boolean, description: Whether detection runs. Default false.}
            mode: {type: string, enum: [detect_only, enforce], description: Count only, or act on what is found. Default detect_only.}
            entities:
              type: object
              description: Action per entity type. A type left out takes its default action. CUSTOM (the deny_terms) is not configurable and is always pseudonymized.
              propertyNames: {enum: [EMAIL, PHONE, CARD, IBAN, NATIONAL_ID, IP, API_KEY, GITHUB_TOKEN, JWT, PRIVATE_KEY]}
              additionalProperties: {type: string, enum: [pseudonymize, block, allow]}
            allow_terms: {type: array, maxItems: 500, description: Values never to redact. Each 1 to 100 characters, not blank, no control characters., items: {type: string, minLength: 1, maxLength: 100}}
            deny_terms: {type: array, maxItems: 500, description: Values always pseudonymized as CUSTOM. Each 1 to 100 characters, not blank, no control characters., items: {type: string, minLength: 1, maxLength: 100}}
        paused_users:
          type: array
          description: Users whose replies are refused (`403 user_paused`) and whose running replies are stopped (error code `user_paused`).
          items:
            type: string
        catalog:
          type: array
          description: >-
            The approved models (ADR 0014). A reply may use one of these and nothing else, so an empty catalog approves
            nothing. Each names a provider in this configuration, and no model twice.
          items:
            $ref: '#/components/schemas/CatalogEntry'
        default_model:
          type: [string, 'null']
          description: The catalog's default, `provider/model`. Present exactly when the catalog is not empty, and one of its models.
        role_pins:
          type: object
          description: The model each role uses, `provider/model`, keyed by role (plan W4.1). Left out while empty.
          additionalProperties:
            type: string
          propertyNames:
            enum: [chat.manual, search.query, search.writer, research.researcher, research.writer, judge.review]
    CatalogEntry:
      type: object
      required: [provider_id, model]
      properties:
        provider_id:
          type: string
        model:
          type: string
          description: The model's own name, 1 to 200 characters. It may contain slashes.
    ModelChoice:
      type: object
      required: [id, provider_id, provider_name, model]
      properties:
        id:
          type: string
          description: "`provider/model`: the provider's id, a slash, and the model's name."
        provider_id:
          type: string
        provider_name:
          type: string
        model:
          type: string
    ModelList:
      type: object
      required: [models, default]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelChoice'
        default:
          type: [string, 'null']
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
    ChatRequest:
      type: object
      required: [provider_id, model, user_id, generation_id, system, messages]
      properties:
        provider_id:
          type: string
        model:
          type: string
          description: The model to call. The catalog must approve it for this provider (`400 model_not_approved`).
        role:
          type: string
          enum: [chat.manual, search.query, search.writer, research.researcher, research.writer, judge.review]
          description: What the request is for. A role with no model pinned is refused (`400 role_not_pinned`). Absent means none.
        user_id:
          type: string
        client_id:
          type: [string, 'null']
        space_id:
          type: [string, 'null']
        conversation_id:
          type: [string, 'null']
        generation_id:
          type: string
          description: The trace id of every span of this reply. 1 to 64 letters, digits, `-` or `_`.
        system:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    FailureClass:
      type: string
      enum: [retryable, auth_failed, fatal]
    ChatEvent:
      description: One event of the stream, in the order `span`, `delta`/`usage`, then `done` or `error`.
      oneOf:
        - type: object
          required: [event, span_id, trace_id]
          properties:
            event:
              const: span
            span_id:
              type: string
            trace_id:
              type: string
        - type: object
          required: [event, text]
          properties:
            event:
              const: delta
            text:
              type: string
        - type: object
          required: [event, estimated]
          properties:
            event:
              const: usage
            input:
              type: [integer, 'null']
            output:
              type: [integer, 'null']
            cache_read:
              type: [integer, 'null']
            cache_write:
              type: [integer, 'null']
            estimated:
              type: boolean
        - type: object
          required: [event, attempts]
          properties:
            event:
              const: done
            finish_reason:
              type: [string, 'null']
            ttft_ms:
              type: [integer, 'null']
            attempts:
              type: integer
        - type: object
          required: [event, code, class, attempts]
          properties:
            event:
              const: error
            code:
              type: string
              description: '`config`, `connect`, `stream`, `http_<status>` or `audit_backlog`. Never the provider''s words.'
            class:
              $ref: '#/components/schemas/FailureClass'
            retry_after_secs:
              type: [integer, 'null']
            attempts:
              type: integer
