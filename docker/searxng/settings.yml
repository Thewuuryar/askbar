# Askbar's settings for the pinned SearXNG image (ADR 0057). Reference: https://docs.searxng.org/admin/settings/
# start.sh copies this file to /etc/searxng/settings.yml (tmpfs) with a random secret_key in place of @SECRET@, so no secret is
# committed or kept in an environment variable. Nothing uses sessions with the limiter off, so an ephemeral key is fine.

use_default_settings:
  engines:
    keep_only: [duckduckgo, brave, yahoo, mwmbl]

general:
  instance_name: askbar-searxng
  enable_metrics: false

search:
  safe_search: 2
  autocomplete: ""
  favicon_resolver: ""
  formats: [json]

server:
  secret_key: "@SECRET@"
  limiter: false
  image_proxy: false

# Every request to an engine goes through the egress proxy's `searxng` listener, which allows only the hosts the admin pushed.
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  proxies:
    all://:
      - http://egress-searxng-host:3128

# Only this plugin (a plugins: key replaces upstream's list).
plugins:
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

# brave, yahoo and mwmbl are off in upstream's defaults. Not in the plan's list: mojeek is `inactive` upstream (proof-of-work captcha),
# and wikipedia refuses to load without general.contact_url, which would send a project URL to an outside service.
engines:
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
