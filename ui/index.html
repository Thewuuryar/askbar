<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <title>Askbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="card" data-history="closed" data-thread="empty">

    <aside class="history" id="history" aria-label="Conversation history" hidden>
      <header class="history-head">
        <h2>History</h2>
        <button type="button" class="text-btn" id="new-chat">New chat</button>
      </header>
      <div class="history-list" id="history-list"></div>
    </aside>

    <main class="main">
      <div class="bar">
        <svg class="bar-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5Z"/>
        </svg>
        <textarea id="input" rows="1" spellcheck="false" autocomplete="off" aria-label="Ask a question" placeholder="Ask anything"></textarea>
        <button type="button" class="icon-btn stop" id="stop" title="Stop (Esc)" aria-label="Stop" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="history-toggle" title="History (Ctrl+H)" aria-label="Toggle history" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5h16M4 12h16M4 18.5h10"/>
          </svg>
        </button>
      </div>

      <div class="notice" id="notice" role="status" hidden>
        <span id="notice-text"></span>
        <button type="button" class="text-btn" id="notice-config" hidden>Open config</button>
        <button type="button" class="text-btn" id="notice-close" aria-label="Dismiss">Dismiss</button>
      </div>

      <div class="status" id="status" role="alert" hidden>
        <span id="status-text"></span>
        <span class="status-actions" id="status-actions"></span>
      </div>

      <form class="pair" id="pair" hidden>
        <p>Paste the pairing string from the server's admin page, or from <code>askbar-server create-pair-code</code>.</p>
        <div class="pair-row">
          <input id="pair-input" type="text" spellcheck="false" autocomplete="off" aria-label="Pairing string" placeholder="askbar-pair:…">
          <button type="submit" class="text-btn" id="pair-submit">Pair</button>
          <button type="button" class="text-btn" id="pair-cancel">Cancel</button>
        </div>
        <p class="pair-error" id="pair-error" role="alert" hidden></p>
      </form>

      <div class="thread" id="thread" aria-live="polite" hidden></div>

      <footer class="foot" id="foot" hidden>
        <span id="model-label"></span>
        <span class="hints">Enter send &nbsp; Shift+Enter new line &nbsp; Ctrl+H history &nbsp; Ctrl+N new chat &nbsp; Esc close</span>
      </footer>
    </main>
  </div>

  <script src="markdown.js"></script>
  <script src="main.js"></script>
</body>
</html>
