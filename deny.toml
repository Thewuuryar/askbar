# cargo-deny (ADR 0017, ADR 0026). CI runs `cargo deny check` for the services' workspace and for
# clients/desktop with this file. The npm license check (scripts/check-npm-licenses.js) reads the same
# `allow` list, so it is the one license allowlist for the project.

[advisories]
version = 2
# A RustSec advisory fails the check. Ignore one only with its ID, a reason and a date to look again.
ignore = []

[licenses]
version = 2
# The license allowlist. A dependency whose license is not covered needs an ADR first (ADR 0026); one
# that is covered needs a reason in the pull request.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",      # Askbar's own crates
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",    # webpki-roots: the Mozilla root certificate list, as data
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",                # file-level copyleft (cssparser, selectors in the desktop client)
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Several versions of one crate are common in the Tauri tree and cost only build time.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
