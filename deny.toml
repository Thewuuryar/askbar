# cargo-deny (ADR 0017, ADR 0026). CI runs `cargo deny check` for the services' workspace and for
# clients/desktop with this file. The npm license check (scripts/check-npm-licenses.js) reads the same
# `allow` list, so it is the one license allowlist for the project.

[advisories]
version = 2
# A RustSec advisory fails the check. Ignore one only with its ID, a reason and a date to look again.
ignore = [
    # The desktop client, through Tauri; unmaintained, not vulnerable, and no safe upgrade. Revisit by
    # 2027-02-01, or when Tauri moves on: proc-macro-error comes from glib-macros 0.18 in Tauri's GTK
    # stack on Linux (ADR 0044 keeps glib at 0.18 with Tauri); the zvariant and zbus_names crates were
    # folded into zbus 6, and come through zbus 5 in opener and tauri-plugin-single-instance.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros 0.18 in Tauri's GTK stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 in opener and tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 in opener and tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 in opener and tauri-plugin-single-instance" },
    # basic-toml is unmaintained, with no safe upgrade. It comes in through askama_derive 0.16.1 (the
    # latest askama), which uses it at compile time to read our own services/admin/askama.toml; it is in
    # no binary. Revisit by 2027-02-01, or when askama moves to the toml crate.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml in askama's compile-time macro, reading our own askama.toml; in no binary" },
    # proc-macro-error2 is unmaintained, with no safe upgrade. It is a procedural-macro crate (compile time only, so in no binary): age
    # 0.11 uses it through i18n-embed-fl to build its translated messages. Askbar uses age (the `backup` feature of askbar-service,
    # ADR 0013) for X25519 and passphrase encryption. age 0.12 would drop it but pulls crypto-bigint 0.5.5 (RUSTSEC-2026-0387, a
    # vulnerability, through P-256 support we never call), which is worse. Revisit by 2027-02-01, or when age moves on.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via i18n-embed-fl in age 0.11's compile-time macros; in no binary" },
]

[licenses]
version = 2
# The license allowlist. A dependency whose license is not covered needs an ADR first (ADR 0026); one
# that is covered needs a reason in the pull request.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",      # Askbar's own crates
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",    # webpki-roots: the Mozilla root certificate list, as data
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",                # file-level copyleft (cssparser, selectors in the desktop client)
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# One list serves both workspaces and the npm check, so an entry one of them never uses is expected.
unused-allowed-license = "allow"

[bans]
# Several versions of one crate are common in the Tauri tree and cost only build time.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own crates are fine: every one of them sets `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
