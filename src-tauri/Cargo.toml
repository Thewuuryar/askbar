[package]
name = "askbar"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2021"
description = "A Spotlight-style, conversation-only AI popup"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
askbar-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"
askbar-proto = { path = "../askbar-proto" }
opener = { version = "0.8", features = ["reveal"] }
