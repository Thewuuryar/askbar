[package]
name = "askbar-service"
license = "AGPL-3.0-or-later"
publish = false
version = "1.0.0"
edition = "2021"
description = "What every Askbar service shares: per-link token checks, status, and the not-configured gate"

[features]
# Backups (ADR 0013, D22): the age encryption the admin makes its backup key with, and every component encrypts its export with.
# Off unless a service asks for it, so the others do not link the cryptography they never use.
backup = ["dep:age"]
# Approvals (plan 5a, P5.5): Ed25519 keys, sign and verify for one tool action. ring is already in the lock file (rustls).
# Off unless a service asks for it, so the others do not link a ring of their own choosing.
approval = ["dep:ring"]
# PII detection (plan PII-P2.6): the patterns and checksums the model gateway and the MCP gateway front share. regex is already in the lock file.
# Off unless a service asks for it, so the others do not link a regex engine they never use.
pii = ["dep:regex"]

[dependencies]
# 0.11, not 0.12: 0.12 pulls crypto-bigint 0.5.5 (RUSTSEC-2026-0387, through P-256 support we never call), which cargo deny refuses.
# No optional features (no ssh keys, no plugins, no armor): X25519 recipients and a passphrase (scrypt) recipient are in it.
age = { version = "0.11", default-features = false, optional = true }
askbar-proto = { path = "../askbar-proto", features = ["axum"] }
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
ring = { version = "0.17", default-features = false, optional = true }
regex = { version = "1", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
ulid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true

# The smoke test's signer (scripts/smoke.sh): no service holds the private key, so the smoke makes its own.
[[example]]
name = "sign_approval"
required-features = ["approval"]
