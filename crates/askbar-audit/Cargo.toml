[package]
name = "askbar-audit"
license = "AGPL-3.0-or-later"
publish = false
version = "0.6.0"
edition = "2021"
description = "The audit store: spans and sealed payloads in their own SQLite file (ADR 0052)"

[dependencies]
askbar-service = { path = "../askbar-service" }
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
ulid = "1"

[lints]
workspace = true
