# Trivy's ignore file for the image scan in .github/workflows/ci.yml (ADR 0017, D30).
#
# A finding is ignored only with its ID, a statement that says why it does not matter here (or why nothing can be done yet), and a date
# (`expired_at`) after which Trivy reports it again, so an ignore is a decision to look again, never a permanent one. Scripts/check-docs.sh
# refuses an entry that lacks any of the three. Findings that have a fix fail the scan; ones with no fix yet are not reported at all
# (`--ignore-unfixed`), so this list is for the others: a fix exists, but cannot be taken yet (say what is waiting for it).
#
# Example (remove the leading `#` from each line and fill it in):
#   - id: CVE-2026-00000
#     statement: in a package the image does not run; the base image's fix is waiting for Debian's next point release
#     expired_at: 2026-12-31
vulnerabilities: []
