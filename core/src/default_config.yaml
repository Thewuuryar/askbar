# Askbar settings.
#
# Provider, model, key and prompt changes apply on your next message.
# Changes to `hotkey` and `ui` need "Reload config" from the tray menu.

# Global shortcut that shows/hides the window.
# Examples: "Super+A", "Alt+Space", "CmdOrCtrl+Shift+K".
# Note: Super+A is reserved by Windows (Quick Settings) and GNOME (app grid),
# so pick something else there.
hotkey: "Ctrl+Shift+Space"

# Name of the entry in `providers` to use.
active_provider: anthropic

system_prompt: |
  You are a fast, concise assistant in a quick-question popup.
  Answer directly. Use Markdown when it helps (lists, code blocks).
  You cannot access the user's computer, files, or the internet.

# Each provider is either:
#   type: openai     any OpenAI-compatible /chat/completions endpoint
#   type: anthropic  the Anthropic Messages API
#
# API key: put it in `api_key`, or name an environment variable in
# `api_key_env`. Local servers (Ollama, LM Studio) need no key.
# Optional per provider: max_tokens, temperature, headers (extra HTTP headers).
providers:
  - name: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    api_key: ""
    model: claude-sonnet-5-5
    max_tokens: 4096

  - name: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    api_key: ""
    model: gpt-4o-mini

  - name: ollama
    type: openai
    base_url: http://localhost:11434/v1
    model: llama3.2

  - name: openrouter
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-sonnet-5-5

history:
  # How many recent messages to send to the model with each question.
  # Leave as null to send the whole conversation.
  context_messages: null

ui:
  theme: auto            # auto | light | dark
  width: 720             # width of the bar, in pixels
  max_height: 640        # tallest the window may grow, in pixels
  history_width: 260     # width of the history panel, in pixels
  top_percent: 0.22      # distance from the top of the screen, 0.0 to 0.8
  hide_on_blur: true     # hide when you click elsewhere
  macos_hide_dock_icon: true
